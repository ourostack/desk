name: Hosted Desk deploy

# Deploys the hosted Desk gateway (hosted/) to Azure Container App ouro-desk-hosted. Hosted Desk serves only released
# Desk, so this runs after a successful Desk release, on the release commit at the head of main, and never on an
# unreleased merge. A change to the gateway alone deploys by hand (workflow_dispatch on main) after it merges.
#
# It signs in to Azure with OIDC as identity id-ourowork-github-prod, whose federated credential trusts
# repo:ourostack/desk:ref:refs/heads/main (hosted/infra/provision.sh). The job therefore names no environment, which
# would change the token's subject. Repository variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, and
# DESK_PUBLIC_URL for the health check (the app's Azure address when unset).
#
# Steps: build the image in the registry with `az acr build`, tagged with the commit SHA; point the app at it; wait for
# the new revision to be ready; then poll /healthz until it answers 200, or fail.

on:
  workflow_run:
    workflows: ["Desk release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deploy at a time, and a deploy is never cancelled halfway; a later one waits and then deploys the newer main.
concurrency:
  group: hosted-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy hosted Desk
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: rg-ouro-work-substrate
      REGISTRY: ouroworkprodk2aumligevt3e
      APP: ouro-desk-hosted
    steps:
      # main's head, not the commit the release started from: the release commits to main itself.
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install the Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Choose the image
        id: image
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          login_server="$(az acr show -n "$REGISTRY" --subscription "$SUBSCRIPTION" --query loginServer -o tsv)"
          image="$login_server/$APP:$sha"
          current="$(az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION" --query "properties.template.containers[0].image" -o tsv)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          # A release run that found nothing to release leaves main where it was; the app already runs it.
          if [ "$current" = "$image" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "$APP already runs $image."
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "$APP runs $current; deploying $image."
          fi

      - name: Build the image
        if: steps.image.outputs.current != 'true'
        env:
          SHA: ${{ steps.image.outputs.sha }}
        run: az acr build --registry "$REGISTRY" --subscription "$SUBSCRIPTION" --image "$APP:$SHA" --file hosted/Dockerfile .

      - name: Deploy the image
        if: steps.image.outputs.current != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: az containerapp update -n "$APP" -g "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION" --image "$IMAGE" --output none

      # The previous revision keeps serving until the new one is ready, so /healthz alone could answer from the old
      # image. Wait until the latest revision runs the new image and is the ready one, then check /healthz.
      - name: Wait for the new revision and its health check
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DESK_PUBLIC_URL: ${{ vars.DESK_PUBLIC_URL }}
        run: |
          set -euo pipefail
          show() { az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION" --query "$1" -o tsv; }
          deadline=$((SECONDS + 900))
          until [ "$(show properties.latestReadyRevisionName)" = "$(show properties.latestRevisionName)" ] \
            && [ "$(show 'properties.template.containers[0].image')" = "$IMAGE" ]; do
            revision="$(show properties.latestRevisionName)"
            state="$(az containerapp revision show -n "$APP" -g "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION" --revision "$revision" --query properties.runningState -o tsv || true)"
            if [ "$state" = "Failed" ]; then
              echo "::error title=Hosted Desk revision failed::$revision did not start; see its logs with az containerapp logs show --revision $revision."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=Hosted Desk revision not ready::$revision was not ready after 15 minutes (running state: ${state:-unknown})."
              exit 1
            fi
            sleep 15
          done
          base="${DESK_PUBLIC_URL:-https://$(show properties.configuration.ingress.fqdn)}"
          url="${base%/}/healthz"
          deadline=$((SECONDS + 300))
          until [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url")" = "200" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=Hosted Desk is not healthy::$url did not answer 200 within 5 minutes of the revision being ready."
              exit 1
            fi
            sleep 10
          done
          echo "$url answers 200; $APP runs $IMAGE."
