name: Hosted Desk deploy

# Deploys the hosted Desk gateway (hosted/) to Azure Container App ouro-desk-hosted. Hosted Desk serves only released
# Desk, so this runs after a successful Desk release and deploys the newest Release Desk commit on main, never an
# unreleased merge. A dispatch deploys that same newest release, so a gateway change ships with the next release.
#
# It signs in to Azure with OIDC as identity id-ourowork-github-prod, whose federated credential trusts
# repo:ourostack@265728804/desk@1386529300:ref:refs/heads/main (hosted/infra/provision.sh; ourostack's OIDC subjects carry ids). The job therefore names no environment, which
# would change the token's subject. Repository variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, and
# DESK_PUBLIC_URL for the health check (the app's Azure address when unset).
#
# Steps: refuse a commit whose Desk is not released (a pending changelog fragment); build the image in the registry with `az acr build`, tagged with the commit SHA; point the app at it; wait for
# the new revision to be ready; then poll /healthz until it answers 200, and then /healthz/deep for up to 5 minutes, or fail.

on:
  workflow_run:
    workflows: ["Desk release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deploy at a time, and a deploy is never cancelled halfway; a later one waits and then deploys the newer main.
concurrency:
  group: hosted-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy hosted Desk
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RESOURCE_GROUP: rg-ouro-work-substrate
      REGISTRY: ouroworkprodk2aumligevt3e
      APP: ouro-desk-hosted
    steps:
      # The newest release commit on main, not main's head: merges keep landing while a release runs, so main's head
      # usually carries changelog fragments no release has shipped yet, and a deploy of it would be refused every time.
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the newest Desk release
        run: |
          set -euo pipefail
          release="$(git log -1 --grep='^Release Desk ' --format=%H)"
          if [ -z "$release" ]; then
            echo "::error title=No Desk release on main::main has no Release Desk commit to deploy."
            exit 1
          fi
          git checkout --quiet --detach "$release"
          echo "Deploying $(git log -1 --format='%h %s')."

      # A release commit carries no changelog fragment; one here means the release itself went wrong. Hosted Desk serves
      # only released Desk, so this stays as a check.
      - name: Refuse unreleased Desk
        run: |
          set -euo pipefail
          pending="$(find plugins/desk/changelog.d -type f ! -name README.md | sort)"
          if [ -n "$pending" ]; then
            echo "::error title=Unreleased Desk on main::plugins/desk/changelog.d holds fragments no release has carried, so this commit is not released Desk. Deploy after the Desk release carries them."
            echo "$pending"
            exit 1
          fi

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install the Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Choose the image
        id: image
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          login_server="$(az acr show -n "$REGISTRY" --subscription "$SUBSCRIPTION" --query loginServer -o tsv)"
          image="$login_server/$APP:$sha"
          current="$(az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION" --query "properties.template.containers[0].image" -o tsv)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          # A release run that found nothing to release leaves main where it was; the app already runs it.
          if [ "$current" = "$image" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "$APP already runs $image."
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "$APP runs $current; deploying $image."
          fi

      - name: Build the image
        if: steps.image.outputs.current != 'true'
        env:
          SHA: ${{ steps.image.outputs.sha }}
        run: az acr build --registry "$REGISTRY" --subscription "$SUBSCRIPTION" --image "$APP:$SHA" --file hosted/Dockerfile .

      - name: Deploy the image
        if: steps.image.outputs.current != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: az containerapp update -n "$APP" -g "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION" --image "$IMAGE" --output none

      # The previous revision keeps serving until the new one is ready, so /healthz alone could answer from the old
      # image. Wait until the latest revision runs the new image and is the ready one, then check /healthz.
      - name: Wait for the new revision and its health check
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DESK_PUBLIC_URL: ${{ vars.DESK_PUBLIC_URL }}
        run: |
          set -euo pipefail
          show() { az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION" --query "$1" -o tsv; }
          deadline=$((SECONDS + 900))
          until [ "$(show properties.latestReadyRevisionName)" = "$(show properties.latestRevisionName)" ] \
            && [ "$(show 'properties.template.containers[0].image')" = "$IMAGE" ]; do
            revision="$(show properties.latestRevisionName)"
            state="$(az containerapp revision show -n "$APP" -g "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION" --revision "$revision" --query properties.runningState -o tsv || true)"
            if [ "$state" = "Failed" ]; then
              echo "::error title=Hosted Desk revision failed::$revision did not start; see its logs with az containerapp logs show --revision $revision."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=Hosted Desk revision not ready::$revision was not ready after 15 minutes (running state: ${state:-unknown})."
              exit 1
            fi
            sleep 15
          done
          base="${DESK_PUBLIC_URL:-https://$(show properties.configuration.ingress.fqdn)}"
          url="${base%/}/healthz"
          deadline=$((SECONDS + 300))
          until [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url")" = "200" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=Hosted Desk is not healthy::$url did not answer 200 within 5 minutes of the revision being ready."
              exit 1
            fi
            sleep 10
          done
          echo "$url answers 200; $APP runs $IMAGE."

      # /healthz passes even when the accounts store, Ouro sign-in (ciamlogin.com) or a mapped legacy account is
      # broken. /healthz/deep checks them, answering 503 with only the failing check names, and caches its result for
      # 10 s. It is never the app's startup or liveness probe, so this step fails the workflow but rolls nothing back;
      # rollback stays manual (hosted/README.md).
      - name: Wait for the deep health check
        env:
          DESK_PUBLIC_URL: ${{ vars.DESK_PUBLIC_URL }}
        run: |
          set -euo pipefail
          base="${DESK_PUBLIC_URL:-https://$(az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --subscription "$SUBSCRIPTION" --query properties.configuration.ingress.fqdn -o tsv)}"
          url="${base%/}/healthz/deep"
          deadline=$((SECONDS + 300))
          until status="$(curl -s -o "$RUNNER_TEMP/deep.txt" -w '%{http_code}' --max-time 10 "$url")" && [ "$status" = "200" ]; do
            # The deployed release may predate /healthz/deep (a hand-run deploy after this workflow merged but before
            # the release that carries the route). /healthz already passed, so that image is healthy as far as it can
            # say; a 404 is a notice, not a failure.
            if [ "$status" = "404" ]; then
              echo "::notice title=No deep health check::$url answers 404: this image predates /healthz/deep."
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=Hosted Desk deep health check failing::$url did not answer 200 within 5 minutes: $(head -c 200 "$RUNNER_TEMP/deep.txt" 2>/dev/null || true)"
              exit 1
            fi
            sleep 10
          done
          echo "$url answers 200."
