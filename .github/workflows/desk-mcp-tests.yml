name: desk MCP tests

# Runs the desk MCP server test suite through the coverage gate
# (plugins/desk/mcp `npm run test:coverage`).
# Skill-manifest validation lives in validate-skills.yml and does NOT exercise
# the MCP code, so without this job desk-core changes can merge untested.
# Path-filtered to MCP, offline-evaluation and root validation inputs so related changes run this gate.

on:
  pull_request:
    paths:
      - ".gitattributes"
      - "evals/offline/**"
      - "evals/*.json"
      - "AGENTIC-ENGINEERING-V2.md"
      - "evals/**"
      - "skills/**"
      - "worker/**"
      - "plugins/**"
      - "manifest.json"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/workflows/**"
      - "plugins/desk/mcp/**"
      - "plugins/desk/activation/**"
      - "plugins/desk/.claude-plugin/plugin.json"
      - "plugins/desk/.codex-plugin/plugin.json"
      - "plugins/desk/.mcp.json"
      - "plugins/desk/.mcp.copilot.json"
      - "plugins/desk/agents/**"
      - "plugins/desk/hooks/**"
      - "plugins/desk/output-styles/**"
      - "plugins/desk/plugin.json"
      - "plugins/desk/principles.md"
      - "plugins/desk/skills/**"
      - "plugins/superpowers/**"
      - "plugins/work-suite/.claude-plugin/plugin.json"
      - "plugins/work-suite/.codex-plugin/plugin.json"
      - "plugins/work-suite/plugin.json"
      - "plugins/work-suite/skills/**"
      - "plugins/plain-language/**"
      - "plugins/ponytail-upstream/**"
      - "upstream-sources.lock.json"
      - "plugins/desk/mcp/artifacts/runtime-deps/**"
      - "plugins/desk/artifacts/vector-packs/**"
      - "plugins/desk/artifacts/snapshots/**"
      - "plugins/desk/artifacts/tombstones/**"
      - "plugins/desk/artifacts/publication-policy.json"
      - "plugins/desk/artifacts/publication-policy.schema.json"
      - "plugins/desk/README.md"
      - "plugins/desk/docs/**"
      - "plugins/desk/mcp/README.md"
      - "plugins/desk/activation/README.md"
      - "plugins/desk/mcp/config/performance-budgets.json"
      - "plugins/desk/mcp/scripts/build-runtime-deps-pack.js"
      - "plugins/desk/mcp/scripts/verify-runtime-deps-pack.js"
      - "plugins/desk/mcp/scripts/build-vector-pack.js"
      - "plugins/desk/mcp/scripts/build-snapshot.js"
      - "plugins/desk/mcp/scripts/verify-snapshot.js"
      - "plugins/desk/mcp/scripts/validate-artifacts.js"
      - "desk/tasks/2026-06-14-1335-planning-desk-dependency-activation.md"
      - "scripts/*.cjs"
      - "scripts/test-desk-docs.cjs"
      - ".github/workflows/desk-mcp-tests.yml"
  push:
    branches:
      - main
      - v2-alpha
    paths:
      - ".gitattributes"
      - "evals/offline/**"
      - "evals/*.json"
      - "AGENTIC-ENGINEERING-V2.md"
      - "evals/**"
      - "skills/**"
      - "worker/**"
      - "plugins/**"
      - "manifest.json"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/workflows/**"
      - "plugins/desk/mcp/**"
      - "plugins/desk/activation/**"
      - "plugins/desk/.claude-plugin/plugin.json"
      - "plugins/desk/.codex-plugin/plugin.json"
      - "plugins/desk/.mcp.json"
      - "plugins/desk/.mcp.copilot.json"
      - "plugins/desk/agents/**"
      - "plugins/desk/hooks/**"
      - "plugins/desk/output-styles/**"
      - "plugins/desk/plugin.json"
      - "plugins/desk/principles.md"
      - "plugins/desk/skills/**"
      - "plugins/superpowers/**"
      - "plugins/work-suite/.claude-plugin/plugin.json"
      - "plugins/work-suite/.codex-plugin/plugin.json"
      - "plugins/work-suite/plugin.json"
      - "plugins/work-suite/skills/**"
      - "plugins/plain-language/**"
      - "plugins/ponytail-upstream/**"
      - "upstream-sources.lock.json"
      - "plugins/desk/mcp/artifacts/runtime-deps/**"
      - "plugins/desk/artifacts/vector-packs/**"
      - "plugins/desk/artifacts/snapshots/**"
      - "plugins/desk/artifacts/tombstones/**"
      - "plugins/desk/artifacts/publication-policy.json"
      - "plugins/desk/artifacts/publication-policy.schema.json"
      - "plugins/desk/README.md"
      - "plugins/desk/docs/**"
      - "plugins/desk/mcp/README.md"
      - "plugins/desk/activation/README.md"
      - "plugins/desk/mcp/config/performance-budgets.json"
      - "plugins/desk/mcp/scripts/build-runtime-deps-pack.js"
      - "plugins/desk/mcp/scripts/verify-runtime-deps-pack.js"
      - "plugins/desk/mcp/scripts/build-vector-pack.js"
      - "plugins/desk/mcp/scripts/build-snapshot.js"
      - "plugins/desk/mcp/scripts/verify-snapshot.js"
      - "plugins/desk/mcp/scripts/validate-artifacts.js"
      - "desk/tasks/2026-06-14-1335-planning-desk-dependency-activation.md"
      - "scripts/*.cjs"
      - "scripts/test-desk-docs.cjs"
      - ".github/workflows/desk-mcp-tests.yml"

jobs:
  desk-mcp-tests:
    name: desk MCP test suite
    runs-on: ubuntu-latest
    # Public, read-only and credential-free. This job carries no secret, no Microsoft or private Desk record and no
    # model access, so it can publish a relevant-revision request and status but can never mint a scored evaluation.
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 22 (matches validate-skills.yml; current LTS). The test script
          # uses a `**` glob in `node --test`, which only resolves on Node >= 21,
          # so do NOT drop below 22 here even though engines floor is >= 20.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: plugins/desk/mcp/package-lock.json

      - name: Install dependencies
        working-directory: plugins/desk/mcp
        run: npm ci

      - name: Run desk MCP coverage gate
        working-directory: plugins/desk/mcp
        run: npm run test:coverage

      - name: Verify committed generated artifacts
        run: node scripts/test-desk-generated-artifacts.cjs

      - name: Verify Desk host manifests
        run: node scripts/test-desk-host-manifests.cjs

      - name: Validate Desk healthy-path docs
        run: node scripts/test-desk-docs.cjs

      - name: Build runtime dependency pack
        working-directory: plugins/desk/mcp
        run: npm run runtime:deps-pack:build -- --output-root "$RUNNER_TEMP/desk-runtime-deps"

      - name: Verify runtime dependency pack
        working-directory: plugins/desk/mcp
        run: |
          manifest="$(find "$RUNNER_TEMP/desk-runtime-deps" -name runtime-deps.manifest.json -print -quit)"
          test -n "$manifest"
          npm run runtime:deps-pack:verify -- --pack-dir "$(dirname "$manifest")"

      - name: Verify Desk snapshot artifacts
        working-directory: plugins/desk/mcp
        run: npm run artifact:snapshot:verify -- --plugin-root ..

      - name: Validate Desk shared artifacts
        working-directory: plugins/desk/mcp
        run: npm run artifact:validate -- --desk-root ../../.. --plugin-root ..

      # Path relevance and evaluation status only. Mechanical success of this job is not a scored evaluation: the
      # candidate supplies repository, ref, exact head and changed paths as data, while the trusted fixture, grader,
      # model, reasoning effort, context tier, runtime, baseline and controller stay at the frozen approved revision
      # outside this job. With no trusted controls and no returned result here, relevant source stays pending.
      - name: Publish the relevant-revision evaluation request
        env:
          REVISION_REPOSITORY: ${{ github.repository }}
          REVISION_REF: ${{ github.ref }}
          REVISION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REVISION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REVISION_EVENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          base="${REVISION_BASE:-}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse "${REVISION_HEAD}^")"
          fi
          git diff --name-only "$base" "$REVISION_HEAD" > revision-changed-paths.txt
          node -e '
            const fs = require("node:fs");
            const head = process.env.REVISION_HEAD;
            fs.writeFileSync("revision-request.json", `${JSON.stringify({
              schemaVersion: 1,
              kind: "relevant_revision_request",
              repository: process.env.REVISION_REPOSITORY,
              ref: process.env.REVISION_REF,
              head,
              previousHeads: [],
              changedPaths: fs.readFileSync("revision-changed-paths.txt", "utf8").split("\n").filter(Boolean),
              events: [{ eventId: process.env.REVISION_EVENT_ID, receivedAt: new Date().toISOString(), head }],
            }, null, 2)}\n`);
          '

      - name: Report relevant-revision evaluation status
        run: |
          set -euo pipefail
          node scripts/skill-evals.cjs revision --request revision-request.json > revision-status.json
          node -e '
            const fs = require("node:fs");
            const status = JSON.parse(fs.readFileSync("revision-status.json", "utf8"));
            const line = `relevant=${status.relevance.relevant} categories=${status.relevance.categories.join("|") || "none"} status=${status.status} reason=${status.reason}`;
            console.log(line);
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Relevant-revision evaluation status\n\n${line}\n\n\`\`\`json\n${JSON.stringify(status, null, 2)}\n\`\`\`\n`);
            }
            if (status.green !== false || status.grade !== null) {
              throw new Error("Public CI cannot publish a green or graded evaluation status; the trusted controller owns grading.");
            }
          '

      - name: Retain verified runtime dependency pack
        uses: actions/upload-artifact@v4
        with:
          name: desk-runtime-deps-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/desk-runtime-deps
          if-no-files-found: error
          retention-days: 7

  desk-feedback-windows:
    name: desk private feedback on native Windows
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up the shipped Windows Node ABI
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: plugins/desk/mcp/package-lock.json

      - name: Install test dependencies
        working-directory: plugins/desk/mcp
        run: npm ci

      - name: Verify source-bound evaluation contracts on Windows
        run: node scripts/skill-evals.cjs validate

      - name: Exercise real NTFS protection, private-store CRUD and the offline source mirror
        working-directory: plugins/desk/mcp
        run: |
          node --test --test-name-pattern "^native[: ]" __tests__/feedback/windows_acl.test.js __tests__/feedback/windows_store.test.js __tests__/feedback/source_mirror.test.js
