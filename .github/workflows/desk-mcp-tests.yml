name: desk MCP tests

# Runs the desk MCP server test suite through the coverage gate
# (plugins/desk/mcp `npm run test:coverage`).
# Skill-manifest validation lives in validate-skills.yml and does NOT exercise
# the MCP code, so without this job desk-core changes can merge untested.
# Every pull request runs it, with no path filter: main requires the "CI gate" job below, and a required check from a
# workflow that a path filter skipped would never report and would block the pull request forever. Pushes to main skip only
# the docs no test reads; the Desk release waits for the run that covers the commit it ships (main-ci-gate.mjs).
#
# Two tiers (AGENTS.md, "CI tiers"). A pull request runs the fast tier on Linux: Quick checks first (every changed file parses and the
# changed tests pass, in about two minutes), then the coverage shards, the offline eval tests when the change touches them, unused code
# and the Linux legs of the browser, Crew member-binding and black-box checks. A pull request that changes only the docs no test reads
# (the --outside list in Quick checks) skips all of that and still gets a green CI gate. A push to main or a dispatch runs everything,
# with no narrowing: the fast tier plus the heavy tier, the Windows and macOS legs, the runtime packs, the release dry runs and native
# Windows. A red heavy tier on main opens a "main is red" issue, and the Desk release waits until main is green (main-ci-gate.mjs).

on:
  pull_request:
  push:
    branches:
      - main
    # The same docs Quick checks lets a pull request skip (windows_suite_shards.test.js keeps the lists equal), so every commit that
    # can change a test result gets the full run on main.
    paths-ignore:
      - "docs/**"
      - "SETUP.md"
      - "LICENSE"
  # The scheduled Superpowers refresh dispatches this workflow on its branch, because pull request events raised by
  # the workflow token start no runs. A dispatched run has no base, so the coverage gate falls back to origin/main.
  workflow_dispatch:

# A new push to a pull request supersedes the runs still going for its older commits, so they stop instead of
# queueing behind the new run. Pushes to main and manual dispatches each get their own group and always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The fail-fast pass the rest of this workflow waits for, and the one place that decides what a pull request can affect. `code` is false
  # only when every changed file is a doc no test reads; `evals` is true when the change touches what the offline eval tests read. A push
  # to main or a dispatch has no base here, so both are true and everything runs.
  quick-checks:
    name: Quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      code: ${{ steps.scope.outputs.code }}
      evals: ${{ steps.scope.outputs.evals }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # A pull request is compared with its base (the merge commit's first parent).
      - name: Decide what this change can affect
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: |
          set -euo pipefail
          code="$(node .github/scripts/changed-scope.mjs --outside "$BASE" docs/ SETUP.md LICENSE)"
          evals="$(node .github/scripts/changed-scope.mjs "$BASE" evals/ scripts/skill-evals.cjs scripts/test-skill-evals.cjs plugins/desk/mcp/package.json plugins/desk/mcp/package-lock.json .github/workflows/desk-mcp-tests.yml .github/scripts/changed-scope.mjs)"
          echo "code=${code#run=}" >> "$GITHUB_OUTPUT"
          echo "evals=${evals#run=}" >> "$GITHUB_OUTPUT"
          echo "Can affect the code: ${code#run=}; can affect the offline eval tests: ${evals#run=}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: plugins/desk/mcp/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.code == 'true'
        working-directory: plugins/desk/mcp
        run: npm ci

      - name: Parse every changed file and run the changed tests
        if: steps.scope.outputs.code == 'true'
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: node .github/scripts/quick-checks.mjs "$BASE"

  browser:
    name: Browser fresh and mine (${{ matrix.os }})
    needs: quick-checks
    if: needs.quick-checks.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The Windows and macOS legs are the heavy tier: main and dispatches only.
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"windows-latest"},{"os":"macos-latest"}]' || '[]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Ubuntu 24.04 blocks the unprivileged user namespaces the browser sandbox uses unless the browser ships its own AppArmor profile.
      - name: Allow the browser sandbox on Linux
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Open, use and close real fresh and mine browsers
        env:
          DESK_BROWSER_REAL: "1"
        run: node --import ./tests/desk/mcp/__tests__/_isolated_env.mjs --test ./tests/desk/mcp/__tests__/launch/web.test.js

  # A member's session in a Crew workspace clone binds the clone and writes as that member, with a user-wide DESK set
  # and no --person, on every platform a member uses. Windows runs with core.autocrlf=true, as Git for Windows installs
  # it, so the checkout and the test clones carry CRLF line endings. The coverage shards run these files on Linux only.
  crew-member-binding:
    name: Crew member binding (${{ matrix.os }})
    needs: quick-checks
    if: needs.quick-checks.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Each Node matches the runtime pack Desk ships for that platform; the end-to-end test starts the real server. The macOS and
        # Windows legs are the heavy tier: main and dispatches only. GitHub applies `exclude` before `include`, so an include-only
        # matrix cannot drop legs with `exclude`; the whole list is chosen by event instead.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","node":"22"}]' || '[{"os":"ubuntu-latest","node":"22"},{"os":"macos-latest","node":"22"},{"os":"windows-latest","node":"24"}]') }}
    steps:
      - name: Use CRLF line endings, as Git for Windows does
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: plugins/desk/mcp/package-lock.json
      - name: Install test dependencies
        working-directory: plugins/desk/mcp
        run: npm ci
      - name: Run the member-binding tests
        working-directory: plugins/desk/mcp
        shell: bash
        env:
          GIT_CONFIG_PARAMETERS: ${{ runner.os == 'Windows' && '''core.autocrlf''=''true''' || '' }}
        run: >-
          node --import ../../../tests/desk/mcp/__tests__/_isolated_env.mjs --test
          ../../../tests/desk/mcp/__tests__/desk/crew_member.test.js
          ../../../tests/desk/mcp/__tests__/desk/gh_logins.test.js
          ../../../tests/desk/mcp/__tests__/runtime/crew_binding.test.js
          ../../../tests/desk/mcp/__tests__/runtime/crew_member_admission.test.js
          ../../../tests/desk/mcp/__tests__/runtime/crew_member_end_to_end.test.js
          ../../../tests/desk/mcp/__tests__/crew/workspace_session.test.js
          ../../../tests/desk/mcp/__tests__/ci/windows_hide.test.js

  # Desk's black-box tester (tests/blackbox): installs the shipped plugins the way Copilot and Claude Code do, drives every user-facing
  # behavior through each host's own MCP config and hook manifest against a throwaway desk, compares the two hosts and measures them.
  blackbox:
    name: Black-box tester (${{ matrix.os }})
    needs: quick-checks
    if: needs.quick-checks.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Each Node matches the runtime pack Desk ships for that platform. The Windows leg is the heavy tier: main and dispatches
        # only (chosen by event, because `exclude` cannot remove `include` entries).
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","node":"22"}]' || '[{"os":"ubuntu-latest","node":"22"},{"os":"windows-latest","node":"24"}]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Allow the browser sandbox on Linux
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The search model and browser driver a person downloads once; the run reports whether they were seeded.
      - name: Restore the downloaded search model and browser driver
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/desk-blackbox-cache
          key: desk-blackbox-${{ runner.os }}-${{ hashFiles('plugins/desk/mcp/src/search/embedder.js', 'plugins/desk/mcp/web-catalog.json') }}
      - name: Run the black-box tester on both hosts
        shell: bash
        # Two repeats in alternating host order, so neither host always pays a cold machine's first start.
        run: node tests/blackbox/run.mjs --repeat 2 --out "$RUNNER_TEMP/blackbox" --cache-dir "$RUNNER_TEMP/desk-blackbox-cache" --label "ci-${{ runner.os }}"
      - name: Keep the results
        id: keep-results
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-${{ runner.os }}
          path: ${{ runner.temp }}/blackbox
          if-no-files-found: warn
          retention-days: 14
      - name: Keep the results (retry)
        if: ${{ !cancelled() && steps.keep-results.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-${{ runner.os }}
          path: ${{ runner.temp }}/blackbox
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
      - name: Show the results table
        if: ${{ !cancelled() }}
        shell: bash
        run: cat "$RUNNER_TEMP"/blackbox/*.md >> "$GITHUB_STEP_SUMMARY" || true

  # The instrumented suite runs as parallel shards, each on its own runner so no timing-sensitive test competes with
  # another shard for CPU. Every shard records raw coverage; the desk-mcp-tests job below merges it and applies the
  # coverage gate once, over the combined result.
  desk-mcp-coverage-shards:
    name: desk MCP tests (shard ${{ matrix.shard }})
    needs: quick-checks
    if: needs.quick-checks.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The split size is strategy.job-total, so adding or removing a shard here is the only change needed. Six shards
        # (2 to 6 minutes each) instead of twelve (1 to 3 each, most of it setup): every job takes one of the organization's
        # 60 shared concurrent job slots, and a pull request's jobs waited 10 to 20 minutes for one (2026-11-07).
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: plugins/desk/mcp/package-lock.json

      - name: Install dependencies
        working-directory: plugins/desk/mcp
        run: |
          npm ci

      - name: Run desk MCP coverage shard
        working-directory: plugins/desk/mcp
        env:
          DESK_COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        # A shard that has not finished after 15 minutes (a whole shard job takes about 3 to 8) is stuck, not slow. The
        # shard runs in its own process group so the watchdog can stop exactly it and everything it started: it prints
        # what is still running (the deepest node process names the test file that is not finishing), then signals
        # that group and no other process. A stopped shard exits non-zero, so the run fails there with output.
        run: |
          setsid npm run test:coverage -- --shard "$SHARD" --output "$RUNNER_TEMP/desk-coverage-shard" &
          shard=$!
          (
            sleep 900 & sleeper=$!
            trap 'kill "$sleeper" 2>/dev/null; exit 0' TERM
            wait "$sleeper"
            echo "::error title=Coverage shard ${SHARD} is stuck::still running after 15 minutes; the process tree follows."
            ps -eo pid,pgid,ppid,etimes,stat,args --forest | cut -c1-400
            touch "$RUNNER_TEMP/shard-stuck"
            kill -TERM -- "-$shard" 2>/dev/null || true
            sleep 10
            kill -KILL -- "-$shard" 2>/dev/null || true
          ) &
          watchdog=$!
          status=0
          wait "$shard" || status=$?
          kill "$watchdog" 2>/dev/null || true
          wait "$watchdog" 2>/dev/null || true
          # A shard the watchdog stopped fails even if it exited 0 on the signal.
          if [ -e "$RUNNER_TEMP/shard-stuck" ]; then exit 1; fi
          exit "$status"

      # A failed shard still writes its manifest with its status, so it is uploaded too and the merge names it.
      - name: Retain the shard's raw coverage
        id: retain-coverage
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: desk-coverage-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/desk-coverage-shard
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Retain the shard's raw coverage (retry)
        if: ${{ !cancelled() && steps.retain-coverage.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: desk-coverage-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/desk-coverage-shard
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # The offline evaluation's own unit tests (evals/offline/__tests__, 907 tests, pure Node, no agent runs). They took about five
  # minutes in one process, so Node splits the files across four runners. No coverage gate applies: they are not Desk MCP code.
  # They run only when the change touches what they read (Quick checks decides, so a pull request that cannot affect them takes no
  # runner for them); most pull requests change neither. Main and dispatches always run them.
  offline-eval-tests:
    name: offline eval tests (shard ${{ matrix.shard }})
    needs: quick-checks
    if: needs.quick-checks.outputs.evals == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: plugins/desk/mcp/package-lock.json

      - name: Install dependencies
        working-directory: plugins/desk/mcp
        run: npm ci

      # A throwaway HOME keeps the tests off the runner's real one.
      - name: Run the offline eval unit tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          home="$(mktemp -d "$RUNNER_TEMP/offline-eval-home.XXXXXX")"
          HOME="$home" node --test --test-shard="$SHARD/4" evals/offline/__tests__/*.test.mjs

  # The release's own build and checks, as a dry run on this pull request merged into main: it folds the pending changelog
  # fragments, commits the result to a throwaway HEAD and runs every check the release workflow runs on that commit
  # (scripts/build-and-check-release.sh, shared with desk-release.yml), then discards it. A pull request the release would
  # reject, or whose release tests run nothing, fails here instead of in the release. It is the heavy tier: it runs on main after the
  # merge and on dispatches, and the release waits for main's CI to pass before it builds.
  release-dry-run:
    name: Release dry run (${{ matrix.stage }})
    needs: quick-checks
    if: needs.quick-checks.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stage: [auto, rc, stable]
        # A pull request runs the auto leg, which checks the changelog fragments it adds; the rc and stable legs are the heavy tier.
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && '[{"stage":"rc"},{"stage":"stable"}]' || '[]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: plugins/desk/mcp/package-lock.json

      - name: Install dependencies
        working-directory: plugins/desk/mcp
        run: |
          npm ci

      - name: Build and check the release without keeping it
        env:
          RELEASE_STAGE: ${{ matrix.stage }}
        run: scripts/build-and-check-release.sh --dry-run --stage "$RELEASE_STAGE"

  # Unused code cannot accumulate: knip fails the pull request on a file no entry point reaches, an export nothing imports, an unused
  # dependency or a duplicate export. Its entry points and every exception are in tools/unused-code/knip.jsonc, each with its reason.
  unused-code:
    name: Unused code
    needs: quick-checks
    if: needs.quick-checks.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/unused-code/package-lock.json

      - name: Install dependencies
        working-directory: tools/unused-code
        run: npm ci

      - name: Find unused code
        working-directory: tools/unused-code
        run: npm run knip

  desk-mcp-tests:
    name: desk MCP test suite
    needs: [quick-checks, desk-mcp-coverage-shards]
    # Runs even when a shard failed, so this check fails with the merge's refusal naming the shard. Without it the
    # job would be skipped, and the CI gate would have to tell that skip from a docs-only one.
    if: ${{ !cancelled() && needs.quick-checks.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    # Public, read-only and credential-free. This job carries no secret, no Microsoft or private Desk record and no
    # model access, so it can publish a relevant-revision request and status but can never mint a scored evaluation.
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 22 (matches validate-skills.yml; current LTS). The test script
          # uses a `**` glob in `node --test`, which only resolves on Node >= 21,
          # so do NOT drop below 22 here even though engines floor is >= 20.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: plugins/desk/mcp/package-lock.json

      - name: Install dependencies
        working-directory: plugins/desk/mcp
        run: npm ci

      - name: Collect the coverage shards
        uses: actions/download-artifact@v4
        with:
          pattern: desk-coverage-shard-*
          path: ${{ runner.temp }}/desk-coverage-shards

      # Admits the combined shards: all of one split, each passed, the same changed files, and together exactly the
      # test files of one whole-suite run. Then the 100% line, branch, function and statement gate runs once.
      - name: Run desk MCP coverage gate
        working-directory: plugins/desk/mcp
        env:
          DESK_COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run test:coverage -- --merge "$RUNNER_TEMP/desk-coverage-shards"

      # The boot acceptance harness's own unit tests (pure Node, no agent runs, about 10 seconds). They read task cards through
      # gray-matter, which the install step above provides. A throwaway HOME keeps them off the runner's real one.
      - name: Run the boot acceptance harness unit tests
        run: |
          home="$(mktemp -d "$RUNNER_TEMP/boot-acceptance-home.XXXXXX")"
          HOME="$home" node --test evals/boot-acceptance/*.test.mjs

      - name: Verify committed generated artifacts
        run: node scripts/test-desk-generated-artifacts.cjs

      - name: Verify Desk host manifests
        run: node scripts/test-desk-host-manifests.cjs

      - name: Validate Desk healthy-path docs
        run: node scripts/test-desk-docs.cjs

      # Every reason Desk can publish needs display text in the factory store, whose site build stops on one it has no words for.
      # A store that cannot be reached fails the step (summary: NOT CHECKED); unknown never passes.
      - name: Check the factory store has text for every Desk reason
        run: node scripts/check-factory-reason-text.cjs

      - name: Build runtime dependency pack
        working-directory: plugins/desk/mcp
        run: npm run runtime:deps-pack:build -- --output-root "$RUNNER_TEMP/desk-runtime-deps"

      - name: Verify runtime dependency pack
        working-directory: plugins/desk/mcp
        run: |
          manifest="$(find "$RUNNER_TEMP/desk-runtime-deps" -name runtime-deps.manifest.json -print -quit)"
          test -n "$manifest"
          npm run runtime:deps-pack:verify -- --pack-dir "$(dirname "$manifest")"

      - name: Verify runtime support matrix
        working-directory: plugins/desk/mcp
        run: npm run runtime:support-matrix:verify

      # Path relevance and evaluation status only. Mechanical success of this job is not a scored evaluation: the
      # candidate supplies repository, ref, exact head and changed paths as data, while the trusted fixture, grader,
      # model, reasoning effort, context tier, runtime, baseline and controller stay at the frozen approved revision
      # outside this job. With no trusted controls and no returned result here, relevant source stays pending.
      - name: Publish the relevant-revision evaluation request
        env:
          REVISION_REPOSITORY: ${{ github.repository }}
          REVISION_REF: ${{ github.ref }}
          REVISION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REVISION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REVISION_EVENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          base="${REVISION_BASE:-}"
          # A new branch, a first push and a force-push past the local history all arrive without a usable
          # "before" commit: GitHub sends the all-zero SHA, or one this clone cannot resolve. Comparing against
          # the head's parent would then report only the last commit's paths, and a root commit has no parent at
          # all, so fall back to the empty tree and report every path the pushed head carries. Over-reporting is
          # the safe direction: relevance may only be widened by a missing base, never narrowed.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          git diff --name-only "$base" "$REVISION_HEAD" > revision-changed-paths.txt
          node -e '
            const fs = require("node:fs");
            const head = process.env.REVISION_HEAD;
            fs.writeFileSync("revision-request.json", `${JSON.stringify({
              schemaVersion: 1,
              kind: "relevant_revision_request",
              repository: process.env.REVISION_REPOSITORY,
              ref: process.env.REVISION_REF,
              head,
              previousHeads: [],
              changedPaths: fs.readFileSync("revision-changed-paths.txt", "utf8").split("\n").filter(Boolean),
              events: [{ eventId: process.env.REVISION_EVENT_ID, receivedAt: new Date().toISOString(), head }],
            }, null, 2)}\n`);
          '

      - name: Report relevant-revision evaluation status
        run: |
          set -euo pipefail
          node scripts/skill-evals.cjs revision --request revision-request.json > revision-status.json
          node -e '
            const fs = require("node:fs");
            const status = JSON.parse(fs.readFileSync("revision-status.json", "utf8"));
            // Refuse before any reporting surface is touched: a forbidden state must never reach the job log or the
            // step summary at all, so the guard runs ahead of every console.log and summary append below.
            if (status.green !== false || status.grade !== null || status.scored !== false || status.status === "evaluated") {
              throw new Error("Public CI cannot publish a green or graded evaluation status; the trusted controller owns grading.");
            }
            const line = `relevant=${status.relevance.relevant} categories=${status.relevance.categories.join("|") || "none"} status=${status.status} reason=${status.reason}`;
            console.log(line);
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Relevant-revision evaluation status\n\n${line}\n\n\`\`\`json\n${JSON.stringify(status, null, 2)}\n\`\`\`\n`);
            }
          '

      - name: Retain verified runtime dependency pack
        id: retain-runtime-deps
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: desk-runtime-deps-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/desk-runtime-deps
          if-no-files-found: error
          retention-days: 7
      - name: Retain verified runtime dependency pack (retry)
        if: ${{ steps.retain-runtime-deps.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: desk-runtime-deps-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/desk-runtime-deps
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  desk-runtime-packs:
    name: desk runtime pack (${{ matrix.target }})
    # The heavy tier: main and dispatches only. It waits for no job, not even Quick checks (see below).
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    # A runtime dependency pack embeds its platform's real native binaries, so each target can only be produced
    # honestly on its own operating system and Node ABI. This lane is deliberately independent: it declares no
    # `needs`, so a failing coverage gate can never stop the repository from obtaining the host-bound artifacts
    # the generated-artifact verifier requires. Public, read-only and credential-free; it uploads what it verified
    # and never writes the repository.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-node-127
            runner: ubuntu-latest
            node: "22.23.2"
            platform: linux
            arch: x64
            node_abi: "127"
          - target: win32-x64-node-137
            runner: windows-latest
            node: "24.18.0"
            platform: win32
            arch: x64
            node_abi: "137"
          - target: win32-x64-node-147
            runner: windows-latest
            node: "26.13.1"
            platform: win32
            arch: x64
            node_abi: "147"
          - target: darwin-arm64-node-127
            runner: macos-latest
            node: "22.23.2"
            platform: darwin
            arch: arm64
            node_abi: "127"
          - target: darwin-arm64-node-137
            runner: macos-latest
            node: "24.18.0"
            platform: darwin
            arch: arm64
            node_abi: "137"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up the exact pack Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
          cache-dependency-path: plugins/desk/mcp/package-lock.json

      - name: Confirm the runtime identity this pack will claim
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_NODE_ABI: ${{ matrix.node_abi }}
          EXPECTED_NODE: ${{ matrix.node }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          node -e '
            const actual = {
              platform: process.platform,
              arch: process.arch,
              nodeAbi: process.versions.modules,
              node: process.versions.node,
            };
            const expected = {
              platform: process.env.EXPECTED_PLATFORM,
              arch: process.env.EXPECTED_ARCH,
              nodeAbi: process.env.EXPECTED_NODE_ABI,
              node: process.env.EXPECTED_NODE,
            };
            for (const key of Object.keys(expected)) {
              if (actual[key] !== expected[key]) {
                throw new Error(`runtime ${key} mismatch: expected ${expected[key]}, found ${actual[key]}`);
              }
            }
            const target = `${actual.platform}-${actual.arch}-node-${actual.nodeAbi}`;
            if (target !== process.env.EXPECTED_TARGET) {
              throw new Error(`runtime target mismatch: expected ${process.env.EXPECTED_TARGET}, found ${target}`);
            }
            console.log(`runtime identity confirmed: ${target} on Node ${actual.node}`);
          '

      - name: Install dependencies from the committed lock
        working-directory: plugins/desk/mcp
        run: |
          npm ci

      - name: Build the native runtime dependency pack
        shell: bash
        working-directory: plugins/desk/mcp
        run: npm run runtime:deps-pack:build -- --output-root "$RUNNER_TEMP/desk-runtime-deps"

      - name: Resolve the produced pack directory
        shell: bash
        working-directory: plugins/desk/mcp
        # Path discovery uses the producer's own lock-hash logic instead of a directory search, so it behaves
        # identically on Linux and Windows and never depends on Unix-only tools.
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const { pathToFileURL } = require("node:url");
            import(pathToFileURL(path.resolve("src/runtime/runtime-deps.js")).href).then((runtimeDeps) => {
              const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
              const packageLock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
              const lockHash = runtimeDeps.productionDependencyLockHash({ packageJson, packageLock });
              const target = `${process.platform}-${process.arch}-node-${process.versions.modules}`;
              const packDir = path.join(
                process.env.RUNNER_TEMP,
                "desk-runtime-deps",
                packageJson.version,
                target,
                lockHash,
              );
              for (const file of ["runtime-deps.tgz", "runtime-deps.manifest.json", "runtime-deps.sha256"]) {
                const candidate = path.join(packDir, file);
                if (!fs.existsSync(candidate)) throw new Error(`the producer did not write ${candidate}`);
              }
              fs.appendFileSync(process.env.GITHUB_ENV, `DESK_PACK_DIR=${packDir}\n`);
              console.log(`pack directory: ${packDir}`);
            }).catch((error) => {
              console.error(error instanceof Error ? error.message : String(error));
              process.exit(1);
            });
          '

      - name: Verify the native runtime dependency pack
        shell: bash
        working-directory: plugins/desk/mcp
        run: npm run runtime:deps-pack:verify -- --pack-dir "$DESK_PACK_DIR"

      - name: Confirm the pack manifest claims this exact host
        shell: bash
        working-directory: plugins/desk/mcp
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const manifest = JSON.parse(fs.readFileSync(path.join(process.env.DESK_PACK_DIR, "runtime-deps.manifest.json"), "utf8"));
            const target = `${manifest.platform.os}-${manifest.platform.arch}-node-${manifest.platform.node_abi}`;
            if (target !== process.env.EXPECTED_TARGET) {
              throw new Error(`pack manifest target mismatch: expected ${process.env.EXPECTED_TARGET}, found ${target}`);
            }
            const checksum = fs.readFileSync(path.join(process.env.DESK_PACK_DIR, "runtime-deps.sha256"), "utf8").trim().split(/\s+/u)[0];
            if (checksum !== manifest.archive.sha256) {
              throw new Error("pack checksum sidecar does not match the manifest archive hash");
            }
            console.log(`${target} archive sha256 ${manifest.archive.sha256}`);
          '

      - name: Load the packed native code under this runtime
        shell: bash
        working-directory: plugins/desk/mcp
        # Static signatures cannot prove ABI compatibility, so the lane that produced the pack also loads it:
        # the archive is unpacked into a scratch directory and its own native SQLite addon and vector extension
        # are opened under the exact Node runtime the pack claims. The archive is copied in and extracted by its
        # bare name, because a Windows drive-letter path handed to tar(1) is read as a remote host specification.
        run: |
          smoke="${RUNNER_TEMP//\\//}/desk-pack-smoke"
          rm -rf "$smoke"
          mkdir -p "$smoke"
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            fs.copyFileSync(
              path.join(process.env.DESK_PACK_DIR, "runtime-deps.tgz"),
              path.join(process.env.RUNNER_TEMP, "desk-pack-smoke", "runtime-deps.tgz"),
            );
          '
          cd "$smoke"
          tar -xzf runtime-deps.tgz
          node -e '
            const path = require("node:path");
            const root = path.join(process.cwd(), "node_modules");
            const Database = require(path.join(root, "better-sqlite3"));
            const sqliteVec = require(path.join(root, "sqlite-vec"));
            const db = new Database(":memory:");
            sqliteVec.load(db);
            const { version } = db.prepare("select vec_version() as version").get();
            db.close();
            console.log(`packed native code loaded on ${process.platform}-${process.arch} node-${process.versions.modules}: sqlite-vec ${version}`);
          '

      - name: Load the committed pack with current source and card persistence tools
        shell: bash
        run: >-
          node --import ./tests/desk/mcp/__tests__/_isolated_env.mjs --test
          --test-name-pattern="current shipped pack loads"
          tests/desk/mcp/__tests__/runtime/production_runtime_pack.test.js

      - name: Retain the verified native runtime dependency pack
        id: retain-runtime-pack
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: desk-runtime-pack-${{ matrix.target }}
          path: ${{ runner.temp }}/desk-runtime-deps
          if-no-files-found: error
          retention-days: 7
      - name: Retain the verified native runtime dependency pack (retry)
        if: ${{ steps.retain-runtime-pack.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: desk-runtime-pack-${{ matrix.target }}
          path: ${{ runner.temp }}/desk-runtime-deps
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  desk-native-windows:
    name: desk on native Windows
    needs: quick-checks
    # The heavy tier: main and dispatches only.
    if: github.event_name != 'pull_request' && needs.quick-checks.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up the shipped Windows Node ABI
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: plugins/desk/mcp/package-lock.json

      # With the coverage suite sharded, `npm ci` on Windows (about two to three and a half minutes) became the
      # longest step of the whole workflow. The installed tree is restored whole when the Node version and the
      # committed lock are unchanged, and installed from the lock otherwise.
      - name: Restore installed test dependencies
        id: node-modules
        uses: actions/cache@v4
        with:
          path: plugins/desk/mcp/node_modules
          key: desk-mcp-node-modules-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('plugins/desk/mcp/package-lock.json') }}

      - name: Install test dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: plugins/desk/mcp
        run: npm ci

      - name: Verify source-bound evaluation contracts on Windows
        run: node scripts/skill-evals.cjs validate

      - name: Exercise real NTFS protection, the factory outbox and the source mirror
        working-directory: plugins/desk/mcp
        run: |
          node --import ../../../tests/desk/mcp/__tests__/_isolated_env.mjs --test --test-name-pattern "^native[: ]" ../../../tests/desk/mcp/__tests__/factory/windows_acl.test.js ../../../tests/desk/mcp/__tests__/factory/outbox_windows.test.js ../../../tests/desk/mcp/__tests__/runtime/native_source_mirror.test.js

      # Both host MCP configs start Desk through mcp/bootstrap.cjs with whatever node the host has, so native Windows must complete a real MCP handshake through it.
      - name: Complete an MCP handshake through the Desk bootstrap on Windows
        working-directory: plugins/desk/mcp
        run: |
          node --import ../../../tests/desk/mcp/__tests__/_isolated_env.mjs --test --test-name-pattern "^native[: ]" ../../../tests/desk/mcp/__tests__/launch/bootstrap.test.js

      # A host may start the bootstrap with an older Node than the one Desk ships a pack for; Node 20 has no Windows pack, so the bootstrap must find the Node 24 set up above and run index.js in it.
      - name: Set up an older Node that the bootstrap must re-exec from
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Complete an MCP handshake through the bootstrap's re-exec path on Windows
        working-directory: plugins/desk/mcp
        run: |
          node --version
          node --import ../../../tests/desk/mcp/__tests__/_isolated_env.mjs --test --test-name-pattern "^native[: ]" ../../../tests/desk/mcp/__tests__/launch/bootstrap.test.js

  # The one check main requires from this workflow (.github/rulesets/main-requires-ci.json). It needs every other job
  # here, so a new job that is not listed fails the guard test instead of slipping past the gate, and it runs even
  # when a job failed or was skipped. A skipped job counts as passing for a required check, so this one decides from
  # Quick checks' scope and the event which jobs had to run: each of those must have succeeded, and any other job must
  # have succeeded or been skipped. Quick checks itself must always succeed. It starts no checkout and holds no token.
  ci-gate:
    name: CI gate
    needs:
      - quick-checks
      - blackbox
      - browser
      - crew-member-binding
      - desk-mcp-coverage-shards
      - offline-eval-tests
      - release-dry-run
      - desk-mcp-tests
      - desk-runtime-packs
      - desk-native-windows
      - unused-code
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job that had to run to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          HEAVY: ${{ github.event_name != 'pull_request' }}
        run: |
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if printf '%s\n' "$RESULTS" | jq -e --arg heavy "$HEAVY" '
            (.["quick-checks"].outputs.code == "true") as $code
            | (.["quick-checks"].outputs.evals == "true") as $evals
            | {
                "quick-checks": true,
                "offline-eval-tests": $evals,
                "desk-runtime-packs": ($heavy == "true"),
                "desk-native-windows": ($code and $heavy == "true")
              } as $special
            | .["quick-checks"].result == "success"
              and all(to_entries[]; .key as $job
                | (if ($special | has($job)) then $special[$job] else $code end) as $must
                | .value.result == "success" or (.value.result == "skipped" and ($must | not)))
          ' > /dev/null; then
            echo "Every job that had to run succeeded."
          else
            echo "::error::A job that had to run did not succeed, so the gate fails."
            exit 1
          fi

  # A red CI gate on main opens a "main is red: CI gate" issue for its owner (AGENTS.md, "Red main"), and a green one closes it.
  report-main-health:
    name: Report main health
    needs: ci-gate
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the report script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Open, update or close the red-main issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.ci-gate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/report-main-health.sh "CI gate" "$RESULT" "$RUN_URL" "$GITHUB_SHA"
