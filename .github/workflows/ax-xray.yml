name: AX X-ray
# CI-only Windows evidence probe for local_recovery.test.js, not for merge.
on:
  push:
    branches: [recovery-queued-log-tap-win]
permissions:
  contents: read
jobs:
  ax-xray:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/desk/mcp/package-lock.json
      - working-directory: plugins/desk/mcp
        run: npm ci
      - name: Probe local_recovery TAP on Windows
        run: |
          node -v; git --version; git rev-parse HEAD; echo "runner=$RUNNER_NAME os=$RUNNER_OS image=$ImageVersion"; where git || true
          sha256sum plugins/desk/mcp/scripts/local-recovery.js tests/desk/mcp/__tests__/runtime/local_recovery.test.js
          cd plugins/desk/mcp
          node --import ../../../tests/desk/mcp/__tests__/_isolated_env.mjs --test --test-concurrency=1 --test-reporter=tap ../../../tests/desk/mcp/__tests__/runtime/local_recovery.test.js 2>&1 | tee "$RUNNER_TEMP/lr.tap" || true
          grep -E "^# (tests|pass|fail|skipped|todo|cancelled)" "$RUNNER_TEMP/lr.tap"
