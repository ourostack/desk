name: AX X-ray

# Ouro AX's X-ray against Desk's stdio MCP server, the action claims over its ouro-actions declarations, and the Ouro AX
# census of every agent door Desk has, on every pull request and on main. Each X-ray report is uploaded as an artifact
# whose name contains "xray", and the census as `ax-census`, for the adoption ledger.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ax-xray-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ax-xray:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/desk/mcp/package-lock.json
      - working-directory: plugins/desk/mcp
        run: npm ci
      - name: Probe local_recovery TAP (CI-only evidence, not for merge)
        run: |
          set -o pipefail
          uname -a; node -v; git rev-parse HEAD; echo "runner=$RUNNER_NAME os=$RUNNER_OS image=$ImageVersion"
          sha256sum plugins/desk/mcp/scripts/local-recovery.js tests/desk/mcp/__tests__/runtime/local_recovery.test.js
          cd plugins/desk/mcp
          node --import ../../../tests/desk/mcp/__tests__/_isolated_env.mjs --test --test-concurrency=1 --test-reporter=tap ../../../tests/desk/mcp/__tests__/runtime/local_recovery.test.js 2>&1 | tee "$RUNNER_TEMP/lr.tap"
          grep -E "^# (tests|pass|fail|skipped|todo|cancelled)" "$RUNNER_TEMP/lr.tap"
