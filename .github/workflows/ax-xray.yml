name: AX X-ray
# CI-only evidence probe: released 3.2.552 tree + synthetic Crew consumer, not for merge.
on:
  push:
    branches: [recovery-queued-log-consumer]
permissions:
  contents: read
jobs:
  ax-xray:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/desk/mcp/package-lock.json
      - working-directory: plugins/desk/mcp
        run: npm ci
      - name: Consumer probe on the released tree
        run: |
          node -v; git --version; git rev-parse HEAD; echo "runner=$RUNNER_NAME os=$RUNNER_OS image=$ImageVersion"
          sha256sum plugins/desk/mcp/scripts/local-recovery.js
          node tests/desk/consumer/consumer.mjs 2>&1 | tee "$RUNNER_TEMP/consumer.txt" || true
