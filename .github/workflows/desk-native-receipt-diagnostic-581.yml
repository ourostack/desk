name: Desk native receipt diagnostic 581

# PR paths are cumulative. Every later qualifying push needs separate operation
# admission while this workflow remains in the PR diff; this is not single-use.
on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/desk-native-receipt-diagnostic-581.yml"

permissions:
  contents: read

concurrency:
  group: desk-native-receipt-581-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  native-receipt-581-windows:
    name: Diagnostic 581 native receipt (Windows, nonrequired)
    if: github.event.pull_request.number == 580
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head, not the event merge ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Record head and event merge identities separately
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_MERGE_SHA: ${{ github.sha }}
          EVENT_MERGE_REF: ${{ github.ref }}
        run: |
          printf 'PR head: %s\nPR base: %s\nEvent merge SHA: %s\nEvent merge ref: %s\n' "$PR_HEAD_SHA" "$PR_BASE_SHA" "$EVENT_MERGE_SHA" "$EVENT_MERGE_REF" >> "$GITHUB_STEP_SUMMARY"
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
      - name: Restore the downloaded search model and browser driver
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/desk-blackbox-cache
          key: desk-blackbox-${{ runner.os }}-${{ hashFiles('plugins/desk/mcp/src/search/embedder.js', 'plugins/desk/mcp/web-catalog.json') }}
      - name: Run the black-box tester on both hosts
        shell: bash
        env:
          CI: "true"
          # GITHUB_ACTIONS=true is supplied by Actions, not overridden here.
          DESK_BLACKBOX_NATIVE_RECEIPT_TRACE: "1"
        run: node tests/blackbox/run.mjs --repeat 2 --out "$RUNNER_TEMP/blackbox" --cache-dir "$RUNNER_TEMP/desk-blackbox-cache" --label "ci-Windows"
      - name: Keep the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-Windows-diagnostic-581
          path: ${{ runner.temp }}/blackbox
          if-no-files-found: warn
          retention-days: 14
      - name: Show the results table
        if: ${{ !cancelled() }}
        shell: bash
        run: cat "$RUNNER_TEMP"/blackbox/*.md >> "$GITHUB_STEP_SUMMARY" || true
