name: Desk native receipt diagnostic 581

# Temporary, nonrequired, finite stage diagnostic. Runs only on pushes to the one diagnostic branch's PR that touch this file;
# every later qualifying push needs separate operation admission. Remove before merge.
on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/desk-native-receipt-diagnostic-581.yml"

permissions:
  contents: read

concurrency:
  group: desk-native-receipt-581-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  native-stage-581-windows:
    name: Diagnostic 581 native stage (Windows, nonrequired, fresh job ${{ matrix.attempt }} of 4)
    if: github.event.pull_request.head.ref == 'arimendelow-microsoft-native-capture-timeout-cause'
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        attempt: [1, 2, 3, 4]
    steps:
      - name: Check out exact PR head, not the event merge ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Record head and event merge identities separately
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_MERGE_SHA: ${{ github.sha }}
        run: |
          printf 'PR head: %s\nPR base: %s\nEvent merge SHA: %s\nAttempt: %s\n' "$PR_HEAD_SHA" "$PR_BASE_SHA" "$EVENT_MERGE_SHA" "${{ matrix.attempt }}" >> "$GITHUB_STEP_SUMMARY"
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
      - name: Restore the downloaded search model and browser driver
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/desk-blackbox-cache
          key: desk-blackbox-${{ runner.os }}-${{ hashFiles('plugins/desk/mcp/src/search/embedder.js', 'plugins/desk/mcp/web-catalog.json') }}
      - name: Run the Copilot black-box host once with the opt-in stage diagnostic
        shell: bash
        env:
          CI: "true"
          DESK_BLACKBOX_NATIVE_RECEIPT_TRACE: "1"
          DESK_BLACKBOX_NATIVE_STAGE_TRACE: "1"
        run: node tests/blackbox/run.mjs --hosts copilot --repeat 1 --out "$RUNNER_TEMP/blackbox" --cache-dir "$RUNNER_TEMP/desk-blackbox-cache" --label "diag-581-stage-${{ matrix.attempt }}"
      - name: Keep the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-Windows-diagnostic-581-stage-${{ matrix.attempt }}
          path: ${{ runner.temp }}/blackbox
          if-no-files-found: error
          retention-days: 14
