name: Hosted gateway tests

# The hosted Desk gateway's own test suite (hosted/, `node --test`). It runs only when the gateway changes, so it is
# not one of main's required checks: a required check from a path-filtered workflow would never report on other pull
# requests and would block them.

on:
  pull_request:
    paths:
      - "hosted/**"
      - "plugins/desk/mcp/**"
      - ".github/workflows/hosted-tests.yml"
      - ".github/workflows/hosted-deploy.yml"
      - ".github/workflows/identity-checks.yml"
  push:
    branches:
      - main
    paths:
      - "hosted/**"
      - "plugins/desk/mcp/**"
      - ".github/workflows/hosted-tests.yml"
      - ".github/workflows/hosted-deploy.yml"
      - ".github/workflows/identity-checks.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  hosted-tests:
    name: Hosted gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: |
            hosted/package-lock.json
            plugins/desk/mcp/package-lock.json

      # Lockfiles must fetch from npm itself, never a mirror a developer's machine happened to use, so that `npm ci`
      # here and in the image build checks every sha512 against npmjs. infra/normalize-lockfile.mjs fixes a lockfile.
      - name: Check that the lockfiles resolve from registry.npmjs.org with sha512 integrity
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { nonNpmResolved } from "./hosted/infra/normalize-lockfile.mjs";
            let failed = false;
            for (const path of ["hosted/package-lock.json", "plugins/desk/mcp/package-lock.json"]) {
              const lock = JSON.parse(readFileSync(path, "utf8"));
              const bad = nonNpmResolved(lock);
              if (bad.length) { failed = true; console.error(`${path}: ${bad.length} packages resolve outside registry.npmjs.org: ${bad.slice(0, 5).join(", ")}`); }
            }
            const hosted = JSON.parse(readFileSync("hosted/package-lock.json", "utf8"));
            const weak = Object.entries(hosted.packages).filter(([key, entry]) => key && entry.resolved && !entry.link && !entry.integrity?.startsWith("sha512-")).map(([key]) => key);
            if (weak.length) { failed = true; console.error(`hosted/package-lock.json: ${weak.length} packages lack sha512 integrity: ${weak.slice(0, 5).join(", ")}`); }
            if (failed) process.exit(1);
            console.log("lockfiles resolve from registry.npmjs.org");
          '

      - name: Install dependencies
        working-directory: hosted
        run: npm ci

      # The end-to-end test runs the real Desk plugin from this checkout.
      - name: Install Desk's dependencies
        working-directory: plugins/desk/mcp
        run: npm ci

      # The accounts store's tests also run against Azurite's Table service, whose ETag conditional updates are the
      # real ones the invite race relies on. With DESK_AZURITE=1 the suite fails, rather than skips, if Azurite is down.
      - name: Start Azurite's Table service
        working-directory: hosted
        run: |
          nohup npx azurite-table --inMemoryPersistence --tableHost 127.0.0.1 --tablePort 10002 > "$RUNNER_TEMP/azurite.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:10002/; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/azurite.log"
          echo "Azurite didn't start within 60 seconds" >&2
          exit 1

      - name: Run the gateway tests, end to end and Azurite included
        working-directory: hosted
        env:
          DESK_E2E: "1"
          DESK_AZURITE: "1"
        run: npm test

      # The store suite runs once per store, with tests named `[memory] ...` and `[azurite] ...`. Every one of them must
      # pass against Azurite too: a skipped, todo or missing Azurite test fails the step instead of passing quietly.
      - name: Count the Azurite tests that ran
        working-directory: hosted
        env:
          DESK_AZURITE: "1"
        run: |
          node --disable-warning=ExperimentalWarning --test --test-reporter=tap test/accounts.test.js > "$RUNNER_TEMP/accounts.tap"
          passed() {
            # Passing tests only: not the suite's own line, not a skipped or todo one.
            grep -E "^\s*ok [0-9]+ - \[$1\] " "$RUNNER_TEMP/accounts.tap" | grep -vE '# (SKIP|TODO)' | grep -cv " - \[$1\] accounts store" || true
          }
          memory=$(passed memory)
          count=$(passed azurite)
          echo "Azurite tests run: $count of $memory"
          echo "Azurite tests run: $count of $memory" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -lt 1 ] || [ "$count" -ne "$memory" ]; then echo "Every store test must pass against Azurite as well as in memory" >&2; exit 1; fi

  native-runtime:
    name: Native owning-UID runtime (Linux amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record exact source and native runner
        run: |
          source_status="$(git status --porcelain)"
          mkdir -p native-runtime-evidence/fixture-context
          git rev-parse HEAD > native-runtime-evidence/source.head
          test "$(cat native-runtime-evidence/source.head)" = "$GITHUB_SHA"
          printf '%s' "$source_status" > native-runtime-evidence/source.status
          test ! -s native-runtime-evidence/source.status
          git ls-tree -r HEAD hosted plugins/desk .github/workflows/hosted-tests.yml > native-runtime-evidence/source-tree.txt
          uname -a > native-runtime-evidence/runner-kernel.txt
          uname -m > native-runtime-evidence/runner-architecture.txt
          test "$(cat native-runtime-evidence/runner-architecture.txt)" = x86_64
          docker version > native-runtime-evidence/docker-version.txt
          cp hosted/test/fixtures/runtime-native.Dockerfile native-runtime-evidence/fixture-context/Dockerfile
          cp hosted/test/fixtures/runtime-{native,child,timeout-native,service-native}.js native-runtime-evidence/fixture-context/
          cp hosted/test/fixtures/echo-desk.js hosted/test/fixtures/entra-discovery-ourobottest.json native-runtime-evidence/fixture-context/
          sha256sum hosted/Dockerfile .dockerignore hosted/package-lock.json plugins/desk/mcp/package-lock.json \
            hosted/src/account-runtime.js hosted/src/realm-helper.js hosted/src/service-lifetime.js hosted/src/service-output.js \
            plugins/desk/mcp/index.js plugins/desk/mcp/src/readiness/identity.js \
            native-runtime-evidence/fixture-context/* > native-runtime-evidence/source.sha256

      - name: Build actual production dependencies and source
        run: |
          trap 'printf "%s\n" "$?" > native-runtime-evidence/production-build.exit-code' EXIT
          docker build --platform linux/amd64 --file hosted/Dockerfile \
            --tag desk-hosted-native:production --iidfile native-runtime-evidence/production-image.id . \
            > native-runtime-evidence/production-build.stdout 2> native-runtime-evidence/production-build.stderr
          docker image inspect desk-hosted-native:production > native-runtime-evidence/production-image.json
          docker image inspect --format '{{.Os}}/{{.Architecture}}' desk-hosted-native:production \
            > native-runtime-evidence/production-image.platform
          test "$(cat native-runtime-evidence/production-image.platform)" = linux/amd64

      - name: Add COPY-only maintained fixture overlay
        run: |
          trap 'printf "%s\n" "$?" > native-runtime-evidence/fixture-build.exit-code' EXIT
          docker build --platform linux/amd64 --network none --pull=false \
            --build-arg DESK_NATIVE_BASE=desk-hosted-native:production \
            --tag desk-hosted-native:qualification --iidfile native-runtime-evidence/fixture-image.id \
            native-runtime-evidence/fixture-context \
            > native-runtime-evidence/fixture-build.stdout 2> native-runtime-evidence/fixture-build.stderr
          docker image inspect desk-hosted-native:qualification > native-runtime-evidence/fixture-image.json

      # Cases run sequentially against one real production build. A failure is
      # retained and makes the step red; subsequent cases still supply evidence.
      - name: Qualify actual MCP services, unchanged I1 deadlines and multi-account routing
        run: |
          failed=0
          for mode in services unproven i1 main; do
            case "$mode" in
              services) flags=(-e DESK_NATIVE_SERVICES=1) ;;
              unproven) flags=(-e DESK_NATIVE_SERVICES=1 -e DESK_SERVICE_UNPROVEN=1) ;;
              i1) flags=(-e DESK_NATIVE_TIMEOUTS=1) ;;
              main) flags=(-e DESK_NATIVE_MAIN=1) ;;
            esac
            evidence="native-runtime-evidence/$mode"
            mkdir -p "$evidence"
            name="desk-native-$mode"
            if docker run --name "$name" --platform linux/amd64 \
              --network none --cpus 2 --memory 4g --memory-swap 4g \
              --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
              -e DESK_MULTI_USER=1 "${flags[@]}" desk-hosted-native:qualification \
              node /app/hosted/test/fixtures/runtime-native.js > "$evidence/stdout.log" 2> "$evidence/stderr.log"; then
              status=0
            else
              status=$?
              failed=1
            fi
            printf '%s\n' "$status" > "$evidence/exit-code"
            if ! docker inspect "$name" > "$evidence/container.json" 2> "$evidence/inspect.stderr"; then
              failed=1
            fi
            if ! docker cp "$name:/data/runtime-native" - > "$evidence/state.tar" 2> "$evidence/state.stderr"; then
              failed=1
            fi
            printf '%s: exit %s\n' "$mode" "$status" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"

      - name: Retain native source, image, kernel, output and failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-${{ github.sha }}-${{ github.run_attempt }}
          path: native-runtime-evidence/
          if-no-files-found: error
          retention-days: 14
