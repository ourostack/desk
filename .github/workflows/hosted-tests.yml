name: Hosted gateway tests

# The hosted Desk gateway's own test suite (hosted/, `node --test`). It runs only when the gateway changes, so it is
# not one of main's required checks: a required check from a path-filtered workflow would never report on other pull
# requests and would block them.

on:
  pull_request:
    paths:
      - "hosted/**"
      - "plugins/desk/mcp/**"
      - ".github/workflows/hosted-tests.yml"
  push:
    branches:
      - main
    paths:
      - "hosted/**"
      - "plugins/desk/mcp/**"
      - ".github/workflows/hosted-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  hosted-tests:
    name: Hosted gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: |
            hosted/package-lock.json
            plugins/desk/mcp/package-lock.json

      - name: Install dependencies
        working-directory: hosted
        run: npm ci

      # The end-to-end test runs the real Desk plugin from this checkout.
      - name: Install Desk's dependencies
        working-directory: plugins/desk/mcp
        run: npm ci

      # The accounts store's tests also run against Azurite's Table service, whose ETag conditional updates are the
      # real ones the invite race relies on. With DESK_AZURITE=1 the suite fails, rather than skips, if Azurite is down.
      - name: Start Azurite's Table service
        working-directory: hosted
        run: |
          nohup npx azurite-table --inMemoryPersistence --tableHost 127.0.0.1 --tablePort 10002 > "$RUNNER_TEMP/azurite.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:10002/; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/azurite.log"
          echo "Azurite didn't start within 60 seconds" >&2
          exit 1

      - name: Run the gateway tests, end to end and Azurite included
        working-directory: hosted
        env:
          DESK_E2E: "1"
          DESK_AZURITE: "1"
        run: npm test

      # The Azurite tests are named `[azurite] ...`; a run where none of them passed is a failure, not a quiet skip.
      - name: Count the Azurite tests that ran
        working-directory: hosted
        env:
          DESK_AZURITE: "1"
        run: |
          node --disable-warning=ExperimentalWarning --test --test-reporter=tap test/accounts.test.js > "$RUNNER_TEMP/accounts.tap"
          # Passing tests only: not the suite's own line, not a skipped one.
          count=$(grep -E '^\s*ok [0-9]+ - \[azurite\] ' "$RUNNER_TEMP/accounts.tap" | grep -v '# SKIP' | grep -cv ' - \[azurite\] accounts store' || true)
          echo "Azurite tests run: $count"
          echo "Azurite tests run: $count" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -lt 1 ]; then echo "No Azurite test ran" >&2; exit 1; fi
