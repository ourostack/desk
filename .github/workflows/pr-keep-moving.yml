name: Keep pull requests moving

# Tells a pull request's author, on the PR, when it conflicts with main or a required check is red, naming the files or checks,
# so it is fixed in minutes instead of sitting (.github/scripts/pr-keep-moving.mjs). It comments once per head commit.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["desk MCP tests", "desk MCP tests on Windows"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-keep-moving
  cancel-in-progress: false

jobs:
  nudge:
    name: Nudge authors
    if: ${{ github.event_name == 'push' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Comment on pull requests that conflict or are red
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/pr-keep-moving.mjs
