name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The release-integrity check diffs each plugin against the pull request base.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: plugins/desk/mcp/package-lock.json

      - name: Install Desk MCP dependencies
        working-directory: plugins/desk/mcp
        run: npm ci

      - name: Validate skill repository
        run: node scripts/validate-skills.cjs

      - name: Check plugin dependencies track release channels
        run: node scripts/check-dependency-channels.cjs

      - name: Check every changed plugin ships a new version
        run: node scripts/check-release-integrity.cjs

      - name: Validate skill eval contracts
        run: node scripts/test-skill-evals.cjs && node scripts/skill-evals.cjs validate

      - name: Validate Plain Language
        run: node scripts/test-plain-language-plugin.cjs && node scripts/test-plain-language-hook.cjs

      - name: Validate upstream source steward
        run: node scripts/test-upstream-sources.cjs

      - name: Validate Desk healthy-path docs
        run: node scripts/test-desk-docs.cjs

      - name: Install browser context broker dependencies
        working-directory: plugins/desk/browser-context-broker
        run: npm ci

      - name: Test browser context broker
        working-directory: plugins/desk/browser-context-broker
        run: npm test

  claude-code-load:
    name: Claude Code plugin load
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Latest on purpose: users' Claude Code auto-updates, so a new load rule
      # should fail here before it fails for them.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Install and load every marketplace plugin
        run: node scripts/check-claude-plugin-load.cjs
