name: desk MCP tests on Windows

# Runs the whole Desk unit suite (plugins/desk/mcp `npm test`) on a Windows runner as a standard user: a new local user outside
# the Administrators group, which is what a managed Windows machine gives a person. The main desk MCP tests workflow covers Linux only.
# It runs on every pull request, with no path filter: the tests read plugins/, scripts/, evals/ and the workflows, so no short list of paths is a safe stand-in for "can change a Windows result", and a required check that a filter skips never reports and blocks the pull request. The scheduled Superpowers refresh dispatches it with the
# other pull-request workflows (CI_WORKFLOWS in superpowers-upstream.yml; scripts/test-refresh-superpowers.cjs checks that the two lists match).
# A manual dispatch can add the elevated (administrator) mode with `elevated: true`. That mode is a diagnostic and is not gated: Desk refuses to
# reuse a path owned by the Administrators group, which is what an elevated user's own existing files are.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "Only run test files whose path (under tests/desk/mcp/__tests__) matches this regular expression. Empty runs everything."
        required: false
        default: ""
      elevated:
        description: "Also run the elevated (administrator) mode. It is a diagnostic: Desk refuses to reuse a path owned by the Administrators group, which is what an administrator's own existing files are."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: desk-windows-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-suite:
    name: Windows ${{ matrix.mode }} (shard ${{ matrix.shard }}/8)
    runs-on: windows-latest
    timeout-minutes: 90
    # The elevated mode is a diagnostic that fails by policy (see the comment at the top), so it never turns the run red; the standard mode does.
    continue-on-error: ${{ matrix.mode == 'elevated' }}
    strategy:
      fail-fast: false
      # At most three shards of one run hold a Windows runner at once. The organisation shares about 20 concurrent jobs across every repository, and six shards per pull request let three or four open pull requests starve other repositories' queues. The shards are still all queued, so the run takes longer (about 70 minutes instead of 50) but never holds more than three runners. A test in scripts/windows_suite_cap.test.js pins this number.
      max-parallel: 3
      matrix:
        mode: ${{ fromJSON(inputs.elevated && '["elevated","standard"]' || '["standard"]') }}
        # Eight shards, balanced by the measured per-file times in .github/scripts/suite-durations.json (about 213 minutes of test time in all, so six shards cannot get under 34 minutes each). A test in scripts/windows_suite_shards.test.js checks that this list, the shard arguments and the verdict agree.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The coverage tests resolve a merge base against origin/main, as the Linux suite does, so they need history.
          fetch-depth: 0
          # The standard user can read the checkout's .git/config, so it must not hold the job token.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The Windows runtime pack is built with Node 24.18.0 (desk-mcp-tests.yml, win32-x64-node-137). Node 24.19.0 and later abort when a better-sqlite3 build made against their headers collects a prepared statement (nodejs/node#65446, WiseLibs/better-sqlite3#1515), so this suite pins the version the pack ships with.
          node-version: "24.18.0"
          cache: "npm"
          cache-dependency-path: plugins/desk/mcp/package-lock.json

      - name: Install dependencies
        working-directory: plugins/desk/mcp
        run: npm ci

      - name: Show the account this job runs as
        shell: pwsh
        run: |
          whoami
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          $admin = ([Security.Principal.WindowsPrincipal]$id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          "runner is administrator: $admin"

      - name: Run the suite (elevated)
        if: matrix.mode == 'elevated'
        shell: pwsh
        run: node .github/scripts/run-suite-files.mjs --shard ${{ matrix.shard }}/8 --out results.json --probe-acl --only "$env:ONLY_FILES"
        env:
          GIT_TERMINAL_PROMPT: "0"
          ONLY_FILES: ${{ inputs.only }}

      - name: Run the suite (standard user)
        if: matrix.mode == 'standard'
        shell: pwsh
        run: |
          $command = 'node .github\scripts\run-suite-files.mjs --shard ${{ matrix.shard }}/8 --out results.json --probe-acl --only "' + $env:ONLY_FILES + '"'
          ./.github/scripts/run-as-standard-user.ps1 -WorkDir "$PWD" -Command $command
        env:
          ONLY_FILES: ${{ inputs.only }}

      - name: Show the result in the job summary
        if: always()
        shell: pwsh
        run: |
          "### Windows ${{ matrix.mode }}, shard ${{ matrix.shard }}/8" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path results-summary.md) { Get-Content results-summary.md | Add-Content $env:GITHUB_STEP_SUMMARY } else { "No result was written." | Add-Content $env:GITHUB_STEP_SUMMARY }

      - name: Keep the per-file results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.mode }}-shard-${{ matrix.shard }}
          path: results.json
          if-no-files-found: warn
          # A rerun of only the failed shards uploads under a name an earlier attempt already holds.
          overwrite: true

  # One check that stands for the whole Windows suite, so a branch rule can require a single name. It judges the per-file results the
  # standard-user shards uploaded (not the shards' job conclusions), so a shard that never ran, was cancelled or reported a failed test
  # fails it. The elevated diagnostic is not counted. It is separate from "CI gate" (desk-mcp-tests.yml) because a job's `needs` cannot
  # reach another workflow. This workflow has no path filter, so the check reports on every pull request and can be required.
  windows-suite-result:
    name: Windows suite
    needs: windows-suite
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the verdict script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The verdict compares the shards' files with the suite's test files, so it needs the tests folder's names too.
          sparse-checkout: |
            .github/scripts
            tests/desk/mcp/__tests__

      - name: Download every standard-user shard's results
        uses: actions/download-artifact@v4
        with:
          pattern: windows-standard-shard-*
          path: shard-results

      - name: Fail unless every shard reported and every file passed
        run: node .github/scripts/windows-suite-verdict.mjs shard-results 8 tests/desk/mcp/__tests__ "$ONLY_FILES"
        env:
          ONLY_FILES: ${{ inputs.only }}
