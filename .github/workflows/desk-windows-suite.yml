name: desk MCP tests on Windows

# Runs the whole Desk unit suite (plugins/desk/mcp `npm test`) on a Windows runner as a standard user: a new local user outside
# the Administrators group, which is what a managed Windows machine gives a person. The main desk MCP tests workflow covers Linux only.
# It runs on every pull request, with no path filter: the tests read plugins/, scripts/, evals/ and the workflows, so no short list of paths is a safe stand-in for "can change a Windows result", and a required check that a filter skips never reports and blocks the pull request. The scheduled Superpowers refresh dispatches it with the
# other pull-request workflows (CI_WORKFLOWS in superpowers-upstream.yml; scripts/test-refresh-superpowers.cjs checks that the two lists match).
# A manual dispatch can add the elevated (administrator) mode with `elevated: true`. That mode is a diagnostic and is not gated: Desk refuses to
# reuse a path owned by the Administrators group, which is what an elevated user's own existing files are.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "Only run test files whose path (under tests/desk/mcp/__tests__) matches this regular expression. Empty runs everything."
        required: false
        default: ""
      elevated:
        description: "Also run the elevated (administrator) mode. It is a diagnostic: Desk refuses to reuse a path owned by the Administrators group, which is what an administrator's own existing files are."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: desk-windows-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-suite:
    name: Windows ${{ matrix.mode }} (shard ${{ matrix.shard }}/8)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      OWNED_GIT_PRODUCT_PATHS: |
        owned-git-product-output/export/sources/s01-production-owner.c
        owned-git-product-output/export/sources/s02-production-root.cjs
        owned-git-product-output/export/sources/s03-production-builder.ps1
        owned-git-product-output/export/sources/s04-production-verifier.js
        owned-git-product-output/export/sources/s05-windows-workflow.yml
        owned-git-product-output/export/sources/s06-standard-user.ps1
        owned-git-product-output/export/sources/s07-suite-runner.mjs
        owned-git-product-output/export/sources/s08-product-io.mjs
        owned-git-product-output/export/sources/s09-product-test.js
        owned-git-product-output/export/sources/s10-driver.cjs
        owned-git-product-output/export/sources/s11-test-root.cjs
        owned-git-product-output/export/sources/s12-fault-owner.c
        owned-git-product-output/export/sources/s13-supervisor.c
        owned-git-product-output/export/sources/s14-retention.cjs
        owned-git-product-output/export/sources/s15-workload.cjs
        owned-git-product-output/export/sources/s16-preload.cjs
        owned-git-product-output/export/sources/s17-fixture-builder.ps1
        owned-git-product-output/export/binaries/production-owner.exe
        owned-git-product-output/export/binaries/production-owner-instrumented.exe
        owned-git-product-output/export/binaries/fault-owner.exe
        owned-git-product-output/export/binaries/fault-owner-instrumented.exe
        owned-git-product-output/export/binaries/retained-supervisor.exe
        owned-git-product-output/export/shim/owned-git-child.cjs
        owned-git-product-output/export/manifests/production-assets.json
        owned-git-product-output/export/manifests/fixture-assets.json
        owned-git-product-output/export/manifests/source-assets.json
        owned-git-product-output/safe-evidence/report.json
        owned-git-product-output/safe-evidence/cases.json
        owned-git-product-output/safe-evidence/clock.json
        owned-git-product-output/safe-evidence/observer.json
        owned-git-product-output/safe-evidence/runtime.json
        owned-git-product-output/safe-evidence/build.json
        owned-git-product-output/safe-evidence/retention-controls.json
        owned-git-product-output/safe-evidence/manifest.json
      OWNED_GIT_PROBE_PATHS: |
        owned-git-probe-output/source/probe-owner.c
        owned-git-probe-output/source/probe-shim.cjs
        owned-git-probe-output/source/probe.test.cjs
        owned-git-probe-output/source/channel-workload.cjs
        owned-git-probe-output/source/build.ps1
        owned-git-probe-output/source/preload.cjs
        owned-git-probe-output/artifacts/owned-git/win32-x64/probe-owner.exe
        owned-git-probe-output/artifacts/owned-git/win32-x64/probe-shim.cjs
        owned-git-probe-output/artifacts/owned-git/win32-x64/probe.test.cjs
        owned-git-probe-output/artifacts/owned-git/win32-x64/channel-workload.cjs
        owned-git-probe-output/artifacts/owned-git/win32-x64/observation preload.cjs
        owned-git-probe-output/artifacts/owned-git/win32-x64/sha256-manifest.json
        owned-git-probe-output/report.json
        owned-git-probe-output/safe-evidence/**
        owned-git-probe-interpreters.json
        !owned-git-probe-output/evidence/**
        !owned-git-probe-output/**/*.payload.json
        !owned-git-probe-output/**/channel-config.json
        !owned-git-probe-output/**/*.stdout
        !owned-git-probe-output/**/*.stderr
    # The elevated mode is a diagnostic that fails by policy (see the comment at the top), so it never turns the run red; the standard mode does.
    continue-on-error: ${{ matrix.mode == 'elevated' }}
    strategy:
      fail-fast: false
      # At most three shards of one run hold a Windows runner at once. The organisation shares about 20 concurrent jobs across every repository, and a full set of shards per pull request let three or four open pull requests starve other repositories' queues. The eight shards (about 7 minutes of tests each, from suite-durations.json) are still all queued, so they run in three waves (3, 3 and 2). Each job also spends a few minutes on setup, so the capped run takes roughly 30 to 45 minutes (45 minutes in the run that measured it, with runner queueing) instead of about 15, but never holds more than three runners. A test in scripts/windows_suite_cap.test.js pins this number.
      max-parallel: 3
      matrix:
        mode: ${{ fromJSON(inputs.elevated && '["elevated","standard"]' || '["standard"]') }}
        # Eight shards, balanced by the measured per-file times in .github/scripts/suite-durations.json (about 53 minutes of test time in all, the median over recent runs since #227 made private-store writes cheap, so each of the eight shards is predicted at about 7 minutes of tests). A test in scripts/windows_suite_shards.test.js checks that this list, the shard arguments and the verdict agree.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The coverage tests resolve a merge base against origin/main, as the Linux suite does, so they need history.
          fetch-depth: 0
          # The standard user can read the checkout's .git/config, so it must not hold the job token.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The Windows runtime pack is built with Node 24.18.0 (desk-mcp-tests.yml, win32-x64-node-137). Node 24.19.0 and later abort when a better-sqlite3 build made against their headers collects a prepared statement (nodejs/node#65446, WiseLibs/better-sqlite3#1515), so this suite pins the version the pack ships with.
          node-version: "24.18.0"
          cache: "npm"
          cache-dependency-path: plugins/desk/mcp/package-lock.json

      - name: Provision owned-Git diagnostic floor interpreter
        if: github.event_name == 'workflow_dispatch' && (inputs.only == '^runtime/windows_owned_git_probe\.test\.js$' || (inputs.only == '^runtime/windows_owned_git\.test\.js$' && !inputs.elevated && matrix.mode == 'standard' && matrix.shard == 1))
        uses: actions/setup-node@v4
        with:
          node-version: "20.0.0"

      - name: Record owned-Git floor interpreter
        if: github.event_name == 'workflow_dispatch' && (inputs.only == '^runtime/windows_owned_git_probe\.test\.js$' || (inputs.only == '^runtime/windows_owned_git\.test\.js$' && !inputs.elevated && matrix.mode == 'standard' && matrix.shard == 1))
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          @(@{ path = $node; version = (& $node --version); sha256 = (Get-FileHash $node -Algorithm SHA256).Hash }) | ConvertTo-Json -AsArray | Set-Content owned-git-probe-interpreters.json
          if ($env:PRODUCT_SELECTION -eq 'true') { Move-Item owned-git-probe-interpreters.json owned-git-product-interpreters.json }
        env:
          PRODUCT_SELECTION: ${{ inputs.only == '^runtime/windows_owned_git\.test\.js$' }}

      - name: Provision owned-Git diagnostic Node 22
        if: github.event_name == 'workflow_dispatch' && (inputs.only == '^runtime/windows_owned_git_probe\.test\.js$' || (inputs.only == '^runtime/windows_owned_git\.test\.js$' && !inputs.elevated && matrix.mode == 'standard' && matrix.shard == 1))
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.only == '^runtime/windows_owned_git\.test\.js$' && '22.23.3' || '22' }}

      - name: Record owned-Git Node 22 interpreter
        if: github.event_name == 'workflow_dispatch' && (inputs.only == '^runtime/windows_owned_git_probe\.test\.js$' || (inputs.only == '^runtime/windows_owned_git\.test\.js$' && !inputs.elevated && matrix.mode == 'standard' && matrix.shard == 1))
        shell: pwsh
        run: |
          $binding = if ($env:PRODUCT_SELECTION -eq 'true') { 'owned-git-product-interpreters.json' } else { 'owned-git-probe-interpreters.json' }
          $nodes = @(Get-Content $binding -Raw | ConvertFrom-Json)
          $node = (Get-Command node).Source
          $nodes += @{ path = $node; version = (& $node --version); sha256 = (Get-FileHash $node -Algorithm SHA256).Hash }
          $nodes | ConvertTo-Json -AsArray | Set-Content $binding
        env:
          PRODUCT_SELECTION: ${{ inputs.only == '^runtime/windows_owned_git\.test\.js$' }}

      - name: Restore suite interpreter after owned-Git provisioning
        if: github.event_name == 'workflow_dispatch' && (inputs.only == '^runtime/windows_owned_git_probe\.test\.js$' || (inputs.only == '^runtime/windows_owned_git\.test\.js$' && !inputs.elevated && matrix.mode == 'standard' && matrix.shard == 1))
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Record restored suite interpreter
        if: github.event_name == 'workflow_dispatch' && (inputs.only == '^runtime/windows_owned_git_probe\.test\.js$' || (inputs.only == '^runtime/windows_owned_git\.test\.js$' && !inputs.elevated && matrix.mode == 'standard' && matrix.shard == 1))
        shell: pwsh
        run: |
          $binding = if ($env:PRODUCT_SELECTION -eq 'true') { 'owned-git-product-interpreters.json' } else { 'owned-git-probe-interpreters.json' }
          $nodes = @(Get-Content $binding -Raw | ConvertFrom-Json)
          $node = (Get-Command node).Source
          $nodes += @{ path = $node; version = (& $node --version); sha256 = (Get-FileHash $node -Algorithm SHA256).Hash }
          $nodes | ConvertTo-Json -AsArray | Set-Content $binding
        env:
          PRODUCT_SELECTION: ${{ inputs.only == '^runtime/windows_owned_git\.test\.js$' }}

      - name: Install dependencies
        working-directory: plugins/desk/mcp
        run: npm ci

      - name: Install broker dependencies
        shell: pwsh
        run: npm ci --prefix plugins/desk/browser-context-broker

      - name: Show the account this job runs as
        shell: pwsh
        run: |
          whoami
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          $admin = ([Security.Principal.WindowsPrincipal]$id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          "runner is administrator: $admin"

      - name: Run the suite (elevated)
        if: matrix.mode == 'elevated'
        shell: pwsh
        run: node .github/scripts/run-suite-files.mjs --shard ${{ matrix.shard }}/8 --out results.json --probe-acl --only "$env:ONLY_FILES"
        env:
          GIT_TERMINAL_PROMPT: "0"
          ONLY_FILES: ${{ inputs.only }}
          DESK_TEST_SUITE_MODE: elevated

      - name: Run the suite (standard user)
        if: matrix.mode == 'standard'
        shell: pwsh
        run: |
          $product = $env:ONLY_FILES -ceq '^runtime/windows_owned_git\.test\.js$'
          if ($product -and ('${{ github.event_name }}' -ne 'workflow_dispatch' -or '${{ inputs.elevated }}' -eq 'true')) { throw 'owned-git product: not_admitted' }
          $options = if ($product) { '--timeout-ms 120000' } else { '--probe-acl' }
          $command = 'node .github\scripts\run-suite-files.mjs --shard ${{ matrix.shard }}/8 --out results.json ' + $options + ' --only "' + $env:ONLY_FILES + '"'
          ./.github/scripts/run-as-standard-user.ps1 -WorkDir "$PWD" -Command $command -OwnedGitProduct:$product
        env:
          ONLY_FILES: ${{ inputs.only }}

      - name: Show the result in the job summary
        if: always()
        shell: pwsh
        run: |
          "### Windows ${{ matrix.mode }}, shard ${{ matrix.shard }}/8" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path results-summary.md) { Get-Content results-summary.md | Add-Content $env:GITHUB_STEP_SUMMARY } else { "No result was written." | Add-Content $env:GITHUB_STEP_SUMMARY }

      - name: Keep the per-file results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # One name per run attempt, so a rerun of only the failed shards keeps the earlier attempt's results; the verdict judges each shard by its latest attempt.
          name: windows-${{ matrix.mode }}-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: results.json
          if-no-files-found: warn

      - name: Keep full owned-Git diagnostic evidence
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.only == '^runtime/windows_owned_git_probe\.test\.js$' || (inputs.only == '^runtime/windows_owned_git\.test\.js$' && !inputs.elevated && matrix.mode == 'standard' && matrix.shard == 1))
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.only == '^runtime/windows_owned_git\.test\.js$' && format('owned-git-product-standard-shard-1-attempt-{0}', github.run_attempt) || format('owned-git-probe-{0}-shard-{1}-attempt-{2}', matrix.mode, matrix.shard, github.run_attempt) }}
          path: ${{ inputs.only == '^runtime/windows_owned_git\.test\.js$' && env.OWNED_GIT_PRODUCT_PATHS || env.OWNED_GIT_PROBE_PATHS }}
          if-no-files-found: ${{ inputs.only == '^runtime/windows_owned_git\.test\.js$' && 'error' || 'warn' }}
          retention-days: 7

  # One check that stands for the whole Windows suite, so a branch rule can require a single name. It judges the per-file results the
  # standard-user shards uploaded (not the shards' job conclusions), so a shard that never ran, was cancelled or reported a failed test
  # fails it. The elevated diagnostic is not counted. It is separate from "CI gate" (desk-mcp-tests.yml) because a job's `needs` cannot
  # reach another workflow. This workflow has no path filter, so the check reports on every pull request and can be required.
  windows-suite-result:
    name: Windows suite
    needs: windows-suite
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the verdict script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The verdict compares the shards' files with the suite's test files, so it needs the tests folder's names too.
          sparse-checkout: |
            .github/scripts
            tests/desk/mcp/__tests__

      - name: Download every standard-user shard's results
        uses: actions/download-artifact@v4
        with:
          pattern: windows-standard-shard-*
          path: shard-results

      - name: Fail unless every shard reported and every file passed
        run: |
          if [ "$ONLY_FILES" = '^runtime/windows_owned_git\.test\.js$' ]; then
            if [ "${OWNED_GIT_WINDOWS_RESULT-}" != 'success' ]; then
              exit 1
            fi
          fi
          node .github/scripts/windows-suite-verdict.mjs shard-results 8 tests/desk/mcp/__tests__ "$ONLY_FILES"
        env:
          ONLY_FILES: ${{ inputs.only }}
          OWNED_GIT_WINDOWS_RESULT: ${{ needs.windows-suite.result }}
