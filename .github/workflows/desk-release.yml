name: Desk release

# Releases Desk from the changelog fragments merged pull requests leave in plugins/desk/changelog.d/. Pull requests
# never bump Desk's version or edit the head of its changelog, so they do not conflict with each other; this workflow
# takes the next alpha on every release surface, folds the pending fragments into one changelog entry and commits the
# release straight to main (scripts/release-desk.cjs). Runs one at a time; a run that finds no fragment, because an
# earlier run already released them, does nothing.
#
# Three jobs, because steps in one job share a runner and anything a step leaves behind (a git hook, a background
# process, git configuration) runs in the later steps:
# - build holds only a read token. It installs dependencies, builds the release commit and checks that exact commit,
#   because a push made with the workflow token starts no CI on main.
# - push holds the write token and runs no npm and no repository script. It takes the checked commit from build as a
#   git bundle, verifies it is one commit on the main build started from that changes only release surfaces and
#   removes only fragments, and pushes that commit with hooks disabled.
# - announce runs when build and push did not fail and marks every merged pull request a release has carried that lacks the
#   mark: a comment "Released in Desk <version>" and the `released` label. It catches up on earlier runs. A merged pull request is delivered only when a release has carried it, and Desk's
#   done-gate (plugins/desk/mcp/src/tools/delivery-gate.js, rules in .desk/delivery.json) reads that label.
# - report opens, updates or closes the "Desk release needs attention" issue.
# Main requires the CI gate before a change lands (.github/rulesets/main-requires-ci.json), and GitHub does not let a
# ruleset bypass list name the workflow token (GitHub Actions is refused as a bypass actor). So the push uses a deploy
# key with write access when the DESK_RELEASE_DEPLOY_KEY secret holds one; the ruleset lists deploy keys as a bypass
# actor. The secret lives in the "release" environment, which only runs on main, because the key bypasses every rule and
# a repository secret is readable by a pull request that adds a workflow. Without the secret the push uses the workflow
# token, which only works while main has no such ruleset.

on:
  push:
    branches:
      - main
    paths:
      - "plugins/desk/changelog.d/**"
  # The Superpowers refresh merges with the workflow token, which starts no push-triggered run, so it dispatches this.
  workflow_dispatch:
  # A failed release leaves its fragments pending on main. The daily run releases whatever is still pending, so a fix
  # merged without a fragment, or a transient failure, does not strand them until the next fragment merge.
  schedule:
    - cron: "23 6 * * *"

permissions: {}

concurrency:
  group: desk-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the Desk release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      released: ${{ steps.release.outputs.released }}
      summary: ${{ steps.release.outputs.summary }}
      sha: ${{ steps.release.outputs.sha }}
      base: ${{ steps.release.outputs.base }}
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: plugins/desk/mcp/package-lock.json

      - name: Install Desk MCP dependencies
        working-directory: plugins/desk/mcp
        run: npm ci

      # Builds the release on the checked-out main and runs every check on the release commit. The steps live in
      # scripts/build-and-check-release.sh, which pull request CI also runs as a dry run (desk-mcp-tests.yml), so a
      # release that would fail fails its pull request first.
      - name: Build and check the release
        id: release
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD)"
          RELEASE_OUTPUT="$GITHUB_OUTPUT" RELEASE_RUN_URL="$RUN_URL" scripts/build-and-check-release.sh
          if grep -qx 'released=true' "$GITHUB_OUTPUT"; then
            mkdir -p "$RUNNER_TEMP/desk-release"
            git bundle create "$RUNNER_TEMP/desk-release/release.bundle" refs/heads/main "^$base"
          else
            echo "No changelog fragment is pending; nothing to release." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Hand the checked release commit to the push job
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desk-release
          path: ${{ runner.temp }}/desk-release/release.bundle
          retention-days: 1
          if-no-files-found: error

  push:
    name: Push the Desk release to main
    needs: build
    if: needs.build.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
      # Only to dispatch a new run when main moves while a release is being checked.
      actions: write
    outputs:
      handed_off: ${{ steps.push.outputs.handed_off }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the checked release commit
        uses: actions/download-artifact@v4
        with:
          name: desk-release
          path: ${{ runner.temp }}/desk-release

      # Only this step holds the deploy key. It writes the key to a file, so the git, gh and ssh commands below never have the
      # key in their environment.
      - name: Write the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.DESK_RELEASE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [ -n "${DEPLOY_KEY:-}" ] || exit 0
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/release-deploy-key")

      # Runs git and the shell only. The build job ran dependency code, so nothing it produced is trusted until this step has
      # verified it: the bundle must hold the exact commit build checked, as the only commit on the main build started
      # from, changing only the release surfaces release-desk.cjs names (read from main, not run) and removing only
      # fragments. The token goes to the one git push, through that command's environment, with hooks disabled.
      - name: Verify and push the release
        id: push
        env:
          PUSH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.build.outputs.sha }}
          BASE: ${{ needs.build.outputs.base }}
          SUMMARY: ${{ needs.build.outputs.summary }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/release-deploy-key"
          trap 'rm -f "$key"' EXIT
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::The build job handed over no valid commit."; exit 1; }
          git -c core.hooksPath=/dev/null fetch --quiet --no-tags "$RUNNER_TEMP/desk-release/release.bundle" "+refs/heads/main:refs/desk-release/checked"
          [ "$(git rev-parse refs/desk-release/checked)" = "$SHA" ] || { echo "::error::The release bundle does not hold the checked commit $SHA."; exit 1; }
          [ "$(git rev-list --parents -n 1 "$SHA")" = "$SHA $BASE" ] || { echo "::error::The release commit $SHA is not a single commit on $BASE."; exit 1; }
          if [ "$(git rev-parse HEAD)" != "$BASE" ]; then
            gh workflow run desk-release.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "handed_off=true" >> "$GITHUB_OUTPUT"
            echo "main moved while this release was checked, so it was not pushed; a new run releases on the current main." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          allowed="$(sed -n '/^const DESK_VERSION_FILES = \[/,/^\];/s/^ *"\([^"]*\)",$/\1/p; s/^const CHANGELOG = "\([^"]*\)";$/\1/p' scripts/release-desk.cjs)"
          [ "$(printf '%s\n' "$allowed" | wc -l)" -ge 2 ] || { echo "::error::Could not read the release surfaces from scripts/release-desk.cjs."; exit 1; }
          while IFS=$'\t' read -r status file; do
            if [ "$status" = "M" ] && printf '%s\n' "$allowed" | grep -qxF -- "$file"; then continue; fi
            if [ "$status" = "D" ] && [[ "$file" =~ ^plugins/desk/changelog\.d/[^/]+\.md$ ]] && [ "$file" != "plugins/desk/changelog.d/README.md" ]; then continue; fi
            echo "::error::The release commit changes $file ($status), which is not a release surface or a pending fragment."
            exit 1
          done < <(git diff --no-renames --name-status "$BASE" "$SHA")
          if [ -f "$key" ]; then
            gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/github-known-hosts"
            git remote set-url origin "git@github.com:$GITHUB_REPOSITORY.git"
            export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/github-known-hosts -o StrictHostKeyChecking=yes"
          fi
          credential="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          echo "::add-mask::$credential"
          set +e
          result="$(GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $credential" git -c core.hooksPath=/dev/null push --porcelain --no-verify origin "$SHA:refs/heads/main" 2> "$RUNNER_TEMP/push-error.txt")"
          code=$?
          set -e
          if [ "$code" = 0 ]; then
            echo "Released $SUMMARY." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # --porcelain prints one stable status line per ref: "!", the refspec, then "[rejected] (fetch first)" or
          # "[rejected] (non-fast-forward)" when main moved after the check above.
          if printf '%s\n' "$result" | grep -qE $'^!\t[0-9a-f]{40}:refs/heads/main\t\\[rejected\\] \\((fetch first|non-fast-forward)\\)$'; then
            gh workflow run desk-release.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "handed_off=true" >> "$GITHUB_OUTPUT"
            echo "main moved while this release was pushed, so the push was refused; a new run releases on the current main." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::The release push was refused: $result $(cat "$RUNNER_TEMP/push-error.txt"). If main now refuses this push, check the ruleset's bypass list and the DESK_RELEASE_DEPLOY_KEY secret."
          exit 1

  # Marking is a catch-up, not a one-shot: every merged pull request on main that lacks the `released` label and has a release
  # commit after its merge commit gets a "Released in Desk <version>" comment (the version of the first release after it) and the
  # label. So a run whose marking failed, or a release that was handed off, is repaired by the next run that gets this far, and a
  # run with nothing to release still marks what an earlier run left. The "Desk release needs attention" issue stays open until a run
  # finishes with marking done. This job runs only gh and git, never a repository script, and holds no write access to code. A rerun
  # finds the comment and the label already there and changes nothing, so "Re-run failed jobs" is always safe.
  announce:
    name: Mark the pull requests the releases carry
    needs: [build, push]
    if: always() && needs.build.result == 'success' && (needs.push.result == 'success' || needs.push.result == 'skipped') && needs.push.outputs.handed_off != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only to create the `released` label, add it and comment on the pull requests.
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: released
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Comment on and label every released pull request that lacks the label
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          # Only the last 30 days: older pull requests are not commented on, and a first run stays small.
          since="${MARK_SINCE:-$(date -u -d '30 days ago' +%F)}"
          candidates="$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main --search "-label:$LABEL merged:>=$since" --limit 200 --json number,mergeCommit --jq '.[] | select(.mergeCommit != null) | "\(.number) \(.mergeCommit.oid)"')"
          created=false
          marked=0
          while read -r number commit; do
            [ -n "$number" ] || continue
            # Carried only when a release commit follows its merge commit on main. A release commit is the workflow's own: the bot's
            # exact author email, and a subject that is exactly "Release Desk <version>".
            git merge-base --is-ancestor "$commit" "$head" 2>/dev/null || continue
            subject="$(git log --reverse --ancestry-path --format=%s --extended-regexp --author='^github-actions\[bot\] <41898282\+github-actions\[bot\]@users\.noreply\.github\.com>$' --grep='^Release Desk [0-9]' "$commit..$head" | grep -E -m 1 '^Release Desk [0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+)?$' || true)"
            [ -n "$subject" ] || continue
            version="${subject#Release Desk }"
            if [ "$created" = false ]; then
              # Creating a label that already exists is refused, so the label counts as there when it can be read afterwards.
              if ! gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --color 0e8a16 --description "A Desk release has carried this pull request" 2> "$RUNNER_TEMP/label-error.txt"; then
                [ "$(gh api "repos/$GITHUB_REPOSITORY/labels/$LABEL" --jq .name)" = "$LABEL" ] || { echo "::error::Could not create the $LABEL label: $(cat "$RUNNER_TEMP/label-error.txt")"; exit 1; }
              fi
              created=true
            fi
            body="Released in Desk $version"
            comments="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/comments" --jq '.[].body')"
            if ! grep -qxF -- "$body" <<< "$comments"; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$number/comments" --field body="$body" > /dev/null
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$number/labels" --raw-field "labels[]=$LABEL" > /dev/null
            marked=$((marked + 1))
            echo "Marked #$number as released in Desk $version." | tee -a "$GITHUB_STEP_SUMMARY"
          done <<< "$candidates"
          [ "$marked" -gt 0 ] || echo "Every released pull request already carries the $LABEL label." | tee -a "$GITHUB_STEP_SUMMARY"

  # One open issue per problem: a new failure comments on it, and the next run that releases or finds nothing pending
  # closes it. A run that handed its release to a new run leaves it open, because its fragments are still pending.
  report:
    name: Report the release outcome
    needs: [build, push, announce]
    if: always() && needs.build.result != 'cancelled' && needs.push.result != 'cancelled' && needs.announce.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Only to open, comment on and close the "Desk release needs attention" issue.
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: Desk release needs attention
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report the failed release
        if: needs.build.result == 'failure' || needs.push.result == 'failure' || needs.announce.result == 'failure'
        run: |
          set -euo pipefail
          if [ "${{ needs.announce.result }}" = "failure" ] && [ "${{ needs.build.result }}" != "failure" ] && [ "${{ needs.push.result }}" != "failure" ]; then
            body="The Desk release was published, but marking the pull requests it carries failed in $RUN_URL. Those pull requests have no released label yet, so Desk's done-gate refuses to close tasks that cite them as delivered. Read the failed step and re-run the failed jobs of that run; marking is safe to repeat."
          else
            body="The Desk release failed in $RUN_URL. The changelog fragments on main stay unreleased, and the Desk changes they describe ship without a new version, until a release succeeds. Read the failed step, fix the cause on main (a fragment the release rejects, a failing release check or a refused push), then dispatch desk-release.yml or wait for the daily run."
          fi
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" --json number,title --jq "map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$body"
          fi

      - name: Close the release issue after a successful run
        if: needs.build.result == 'success' && (needs.push.result == 'success' || needs.push.result == 'skipped') && (needs.announce.result == 'success' || needs.announce.result == 'skipped') && needs.push.outputs.handed_off != 'true'
        run: |
          set -euo pipefail
          for number in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$ISSUE_TITLE\" in:title" --json number,title --jq "map(select(.title == env.ISSUE_TITLE)) | .[].number"); do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Resolved: $RUN_URL finished without a pending fragment left unreleased."
          done
