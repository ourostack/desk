name: Desk release

# Releases Desk from the changelog fragments merged pull requests leave in plugins/desk/changelog.d/. Pull requests
# never bump Desk's version or edit the head of its changelog, so they do not conflict with each other; this workflow
# takes the next alpha on every release surface, folds the pending fragments into one changelog entry and commits the
# release straight to main (scripts/release-desk.cjs). Runs one at a time; a run that finds no fragment, because an
# earlier run already released them, does nothing.
#
# The commit is pushed with the workflow token, which main accepts because it has no branch protection or ruleset.
# If main is ever protected, allow this workflow's token to bypass the rule for this push, or give the push a
# deploy key or GitHub App token that may; nothing else here changes. A push made with the workflow token starts no
# other workflow, so the release commit itself is checked here before it is pushed.

on:
  push:
    branches:
      - main
    paths:
      - "plugins/desk/changelog.d/**"
  # The Superpowers refresh merges with the workflow token, which starts no push-triggered run, so it dispatches this.
  workflow_dispatch:

permissions: {}

concurrency:
  group: desk-release
  cancel-in-progress: false

jobs:
  release:
    name: Release Desk from changelog fragments
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: plugins/desk/mcp/package-lock.json

      - name: Install Desk MCP dependencies
        working-directory: plugins/desk/mcp
        run: npm ci

      # Another merge can land while this runs. The release is then rebuilt on the new main, which folds that merge's
      # fragment too, and pushed again; a push never overwrites main.
      - name: Release and push to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            node scripts/release-desk.cjs --date "$(date -u +%F)" > "$RUNNER_TEMP/release.json"
            if [ "$(node -p 'require(process.env.RUNNER_TEMP + "/release.json").released')" != "true" ]; then
              echo "No changelog fragment is pending; nothing to release." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            node scripts/check-release-integrity.cjs
            (cd plugins/desk/mcp && node --import ./__tests__/_isolated_env.mjs --test __tests__/release/release_coupling.test.js __tests__/activation/copilot_packaging.test.js)
            summary="$(node -p 'const r = require(process.env.RUNNER_TEMP + "/release.json"); `Desk ${r.to} from ${r.fragments.length} changelog fragment(s): ${r.fragments.map((f) => f.split("/").pop()).join(", ")}`')"
            version="$(node -p 'require(process.env.RUNNER_TEMP + "/release.json").to')"
            git add --all -- .claude-plugin plugins/desk
            git commit --quiet --message "Release Desk $version" --message "$summary. Released by $RUN_URL."
            if git push --quiet origin HEAD:main; then
              echo "Released $summary." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "main moved during release attempt $attempt; rebuilding the release on the new main."
          done
          echo "::error::main kept moving; dispatch this workflow again to release the pending fragments."
          exit 1
