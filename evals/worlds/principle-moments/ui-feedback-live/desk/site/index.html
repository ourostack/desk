<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<link rel="stylesheet" href="settings.css">
</head>
<body>
<main class="settings">
  <h1>Settings</h1>
  <section>
    <h2>Notifications</h2>
    <label><input type="checkbox" checked> Replies in my threads</label>
    <label><input type="checkbox"> Mentions only</label>
  </section>
  <section>
    <h2>Appearance</h2>
    <label><input type="radio" name="theme" checked> Light</label>
    <label><input type="radio" name="theme"> Dark</label>
  </section>
</main>
</body>
</html>
