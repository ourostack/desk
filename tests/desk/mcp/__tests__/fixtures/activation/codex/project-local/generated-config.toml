# user-authored Codex config
model = "gpt-5.4"
approval_policy = "on-request"

# BEGIN desk activation: desk@3.2.0-alpha.180 mode=project-local owner=desk-activation
[features]
memories = false

[[hooks.PreToolUse]]
matcher = "*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "node \"plugins/desk/hooks/host-enforcement.cjs\" codex"

[[hooks.SessionEnd]]

[[hooks.SessionEnd.hooks]]
type = "command"
command = "node \"plugins/desk/hooks/factory-end.cjs\" codex"
timeout = 3

[plugins."superpowers@ourostack"]
enabled = true

[plugins."desk@ourostack"]
enabled = true

[plugins."plain-language@ourostack"]
enabled = true

[plugins."desk@ourostack".mcp_servers.desk]
enabled = false

[mcp_servers.desk]
command = "node"
args = ["plugins/desk/mcp/bootstrap.cjs", "--activation-config", ".codex/desk.activation.json"]
cwd = "."
enabled = true
default_tools_approval_mode = "prompt"
# END desk activation
